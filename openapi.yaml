  /app-versions:
    post:
      tags: [App 版本管理]
      summary: 管理端：上传 APK 并发布新版本（V5.8 App 自更新）
      description: |-
        【用途】管理后台上传 APK 安装包并登记一个新版本，成功后通过 WebSocket 广播 app:update 给全部在线用户。

        【调用时机】管理后台「版本管理」页发版时。

        【业务规则与注意事项】
        - 仅 admin 可调用；发版低频操作，限流 5 次/分钟/IP（429）。
        - multipart 上传：文件字段 file 仅支持 .apk 扩展名（400 仅支持上传 .apk 文件），最大 50MB（400 APK 体积超过 50MB 上限）。
        - version_code（整数）必须在同平台内全局递增：必须大于该平台当前最大值（含未发布/已撤回的历史记录），否则 400；版本判定一律用整数 version_code，不要用 version_name 字符串比较。
        - 落盘文件名形如 fenxin-<platform>-v<version_name>-<短ID>.apk，经 /uploads/app/ 静态访问；发布成功写入审计日志（publish_app_version）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, version_name, version_code]
              properties:
                file:
                  type: string
                  format: binary
                  description: APK 安装包（仅 .apk，最大 50MB）
                platform:
                  type: string
                  enum: [android, ios]
                  description: 平台，默认 android
                  example: android
                version_name:
                  type: string
                  maxLength: 20
                  description: 版本名（仅展示用，如 5.8），1~20 字符
                  example: '5.8'
                version_code:
                  type: integer
                  minimum: 1
                  maximum: 2100000000
                  description: versionCode / build number：同平台内递增整数，必须大于该平台当前最大值（如 58）
                  example: 58
                force:
                  type: boolean
                  description: 是否强制更新（不装不让进 App），默认 false
                  example: false
                notes:
                  type: string
                  maxLength: 2000
                  description: 更新说明（发版日志），最长 2000 字符
                  example: '1. 修复焚毁倒计时偏移
2. 新增点开才焚'
      responses:
        '200':
          description: 发布成功（message 为「版本发布成功」），data 为已入库的 AppVersion（published=true）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 版本发布成功 }
                  data:
                    $ref: '#/components/schemas/AppVersion'
        '400':
          description: 参数校验失败；或未上传 APK / 非 .apk 文件 / 超过 50MB / version_code 未大于平台当前最大值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 触发发版限流（同一 IP 每分钟最多 5 次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /app-versions/latest:
    get:
      tags: [App 版本管理]
      summary: 用户端：检查更新（App 启动自检，公开接口）
      description: |-
        【用途】App 启动时检查是否有新版本，返回该平台最新已发布版本信息。

        【调用时机】App 启动自检更新（可能在登录前），限流 30 次/分钟/IP（429）。

        【业务规则与注意事项】
        - 公开接口，无需认证。
        - platform 可选（android / ios，默认 android）；current_code 为客户端当前 versionCode，若不小于最新版本号则 data 为 null（已是最新）。
        - 该平台无任何已发布（published=true）版本时 data 也为 null。
        - 版本比较用整数 version_code，不要用 version_name 字符串比较。
      security: []
      parameters:
        - name: platform
          in: query
          schema: { type: string, enum: [android, ios], default: android }
          description: 平台（默认 android）
          example: android
        - name: current_code
          in: query
          schema: { type: integer }
          description: 客户端当前 versionCode；不小于最新版本号时返回 null
          example: 57
      responses:
        '200':
          description: 检查成功；有新版本时 data 为版本信息，已是最新/无已发布版本时 data 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    nullable: true
                    type: object
                    description: 最新可更新版本信息；已是最新或无已发布版本时为 null
                    properties:
                      platform:
                        type: string
                        description: 平台（android / ios）
                        example: android
                      version_code:
                        type: integer
                        description: 最新版本号（整数，客户端据此判断是否更新）
                        example: 58
                      version_name:
                        type: string
                        description: 展示用版本名（如 5.8）
                        example: '5.8'
                      apk_url:
                        type: string
                        description: APK 下载地址（相对路径 /uploads/app/xxx.apk，客户端自行拼 baseURL）
                        example: /uploads/app/fenxin-android-v5.8-3f9a2b8e.apk
                      file_size:
                        type: integer
                        description: APK 文件大小（字节），用于展示与下载进度估算
                        example: 31457280
                      force:
                        type: boolean
                        description: 是否强制更新（true 时客户端弹窗不给「下次再说」）
                        example: false
                      notes:
                        type: string
                        description: 更新说明（发版日志，弹窗内展示）
                        example: '1. 修复焚毁倒计时偏移
2. 新增点开才焚'
                      published_at:
                        type: string
                        format: date-time
                        description: 发布时间
                        example: '2026-09-04T02:00:00.000Z'

  /app-versions/manage:
    get:
      tags: [App 版本管理]
