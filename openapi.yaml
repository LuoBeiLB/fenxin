openapi: 3.0.3
info:
  title: 焚信 BurnMsg API
  version: 2.0.0
  description: |-
    焚信（BurnMsg）是一款企业内部加密即时通讯（IM）应用，支持云聊天与秘密聊天、阅后即焚消息。本文件为其后端（NestJS + TypeORM + MySQL）的标准 OpenAPI 3.0.3 接口文档。

    【账号体系】
    - 不开放自助注册，所有账号由管理后台统一开通（POST /accounts，仅 admin）。
    - 用户名即公司内部手机号（1 开头 11 位数字）。
    - 新开通 / 被重置密码的账号 force_change_pwd=true，前端应强制跳转修改密码，修改成功后该标记置为 false。

    【认证方式】
    - 受保护接口在请求头携带：Authorization: Bearer <access_token>。
    - 双 token 机制：access_token（JWT_SECRET 签名，默认有效期 7200 秒）+ refresh_token（独立的 JWT_REFRESH_SECRET 签名，默认有效期 2592000 秒 / 30 天，payload 带 type=refresh 标记防混用）。
    - access_token 过期后用 refresh_token 调 POST /auth/refresh-token 换取新 token 对。
    - 即时吊销：JWT 守卫除验签外，每个受保护请求都会实时查库校验「账号仍为 active」且「签发 token 的设备记录仍存在」；账号被停用或设备被下线后，已签发的 token 立即失效（全端即时强制下线）。

    【统一响应格式】
    - 成功：{ "code": 0, "message": "ok 或各接口自定义提示语", "data": <业务数据，无内容时为 null> }
    - 失败：{ "code": <HTTP 状态码>, "message": "<错误描述；参数校验失败时为多条错误以 '; ' 拼接>" }

    【通用约定】
    - 分页参数：page（默认 1）、pageSize（默认 20，最大 200；通讯录列表默认 50）。
    - 请求中的时间字段使用 ISO8601 字符串；响应中的时间为服务端 datetime。
    - 所有业务 ID 均为 UUID v4 字符串。
    - 角色：user / admin。标注「仅管理员」的接口仅 admin 可调用，普通用户返回 403。
servers:
  - url: http://localhost:9091/api/v1
    description: 开发环境（部署时请替换为实际域名/IP；端口默认 9091，全局前缀 /api/v1）
security:
  - bearerAuth: []
tags:
  - name: 健康检查
    description: 服务存活探活接口，无需认证。
  - name: 认证
    description: 登录、刷新 token、修改密码、个人资料与已登录设备管理。本系统不开自助注册，账号由管理后台统一开通。
  - name: 账号
    description: 账号管理模块（仅 admin）：开通/批量导入账号、重置密码、启用停用、账号列表与部门列表。
  - name: 通讯录
    description: 企业通讯录：全员分页列表与快速搜索（仅 active 用户，不含本人），用于选人建会话/拉群。
  - name: 会话
    description: 会话管理：创建/获取私聊会话、我的会话列表、会话详情。
  - name: 消息
    description: 消息管理：发送（含阅后即焚）、历史消息游标分页、编辑、撤回、已读标记与消息回执。
  - name: 群组
    description: 群组/频道管理：建群、群资料、群成员增删与角色设置（群主 owner / 管理员 admin / 成员 member）。
  - name: 文件上传
    description: 消息附件上传（multipart），返回的 url 在发消息时填入 file_url。
  - name: 审计日志
    description: 审计日志查询（仅 admin）：登录、开户、改密、重置密码、启用停用、设备下线等敏感操作留痕，供管理后台审计页展示。

paths:
  /health:
    get:
      tags: [健康检查]
      summary: 服务健康检查
      description: |-
        【用途】探活接口，返回服务状态与服务器当前时间。

        【调用时机】负载均衡/监控系统定时探测；前端或运维用于确认服务是否在线。

        【业务规则与注意事项】
        - 公开接口，无需任何认证。
        - 仅表示进程存活，不检测数据库等依赖可用性。
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      status: { type: string, description: 固定为 ok, example: ok }
                      timestamp: { type: string, description: 服务器当前时间（ISO8601）, example: '2026-08-26T03:00:00.000Z' }

  /auth/login:
    post:
      tags: [认证]
      summary: 手机号 + 密码登录，签发 token 对并登记设备
      description: |-
        【用途】用户登录：校验手机号与密码，签发 access_token / refresh_token，并为本次登录登记一条设备记录。

        【调用时机】App 启动且无有效 token，或 token 对均失效需重新登录时。本系统不开自助注册，账号由管理后台开通。

        【业务规则与注意事项】
        - 限流：每 IP 每分钟 5 次，超出返回 429（收紧限流，防手机号遍历与暴力破解）。
        - 连续密码错误累计 login_fail_count，满 5 次账号临时锁定 15 分钟（locked_until），锁定期间登录返回 401 并提示剩余秒数；登录成功后失败计数清零。
        - 账号被停用（status=disabled）时登录返回 401「账号已被停用」。
        - 每次登录都会新建一条设备记录（device_id 为服务端生成的设备指纹 UUID），token payload 中携带该设备记录主键；后续「下线设备」即删除该记录使 token 立即失效。
        - 响应中 force_change_pwd=true 时（新开通或被重置密码的账号），前端必须强制跳转修改密码（POST /auth/change-password）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, device_name, device_type]
              properties:
                phone:
                  type: string
                  pattern: '^1\d{10}$'
                  description: 手机号（即用户名），1 开头共 11 位数字
                  example: '13800138000'
                password:
                  type: string
                  minLength: 1
                  description: 登录密码，不能为空
                  example: 'Admin@123456'
                device_name:
                  type: string
                  description: 设备名称，展示在已登录设备列表中
                  example: iPhone 15
                device_type:
                  type: string
                  enum: [mobile, desktop, tablet, web]
                  description: 设备类型：mobile 手机 / desktop 桌面端 / tablet 平板 / web 网页端
                  example: mobile
      responses:
        '200':
          description: 登录成功（message 为「登录成功」）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 登录成功 }
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/SafeUser'
                      access_token:
                        type: string
                        description: 'JWT 访问令牌，请求受保护接口时放入 Authorization: Bearer 头'
                      refresh_token:
                        type: string
                        description: JWT 刷新令牌（独立密钥签名），用于调用 /auth/refresh-token
                      expires_in:
                        type: integer
                        description: access_token 有效期（秒），默认 7200
                        example: 7200
                      device:
                        $ref: '#/components/schemas/Device'
                      force_change_pwd:
                        type: boolean
                        description: 为 true 时前端应强制跳转修改密码
                        example: false
        '400':
          description: 参数校验失败（如手机号格式不正确、密码为空、device_type 非法）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 400, message: 手机号格式不正确 }
        '401':
          description: 手机号不存在或密码错误（Invalid phone or password）；账号临时锁定中（提示剩余秒数）；账号已停用（账号已被停用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 401, message: Invalid phone or password }
        '429':
          description: 触发限流（每 IP 每分钟 5 次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/change-password:
    post:
      tags: [认证]
      summary: 修改本人密码（首登强制改密走此接口）
      description: |-
        【用途】修改当前登录用户自己的密码。

        【调用时机】用户主动改密；或登录返回 force_change_pwd=true 时前端强制跳转改密（首登强制改密流程）。

        【业务规则与注意事项】
        - 必须先验证旧密码，旧密码不正确返回 400。
        - 新密码长度至少 8 位，否则返回 400。
        - 修改成功后 force_change_pwd 置为 false，前端可解除强制改密拦截。
        - 源码未在改密后强制下线其它设备，已签发的其它 token 仍有效直至过期或被下线。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  description: 当前旧密码
                  example: 'OldPass@123'
                new_password:
                  type: string
                  minLength: 8
                  description: 新密码，长度不能少于 8 位
                  example: 'NewPass@456'
      responses:
        '200':
          description: 修改成功（message 为「密码修改成功」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 密码修改成功 }
                  data: { type: object, nullable: true, example: null }
        '400':
          description: 旧密码不正确（Current password is incorrect）或新密码不足 8 位（新密码长度不能少于8位）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或携带无效/过期的 access_token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 当前 token 对应的用户不存在（User not found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh-token:
    post:
      tags: [认证]
      summary: 用 refresh_token 换新 token 对
      description: |-
        【用途】用有效的 refresh_token 换取一对新的 access_token / refresh_token（双 token 刷新机制）。

        【调用时机】access_token 过期（默认 2 小时）而 refresh_token 仍有效（默认 30 天）时，静默续期，无需重新登录。

        【业务规则与注意事项】
        - 公开接口：仅认 refresh_token，不要求 access_token 有效，调用时无需携带 Authorization 头。
        - 限流：每 IP 每分钟 30 次，超出返回 429。
        - refresh_token 使用独立密钥（JWT_REFRESH_SECRET）签名且 payload 带 type=refresh 标记，access_token 无法冒充刷新。
        - 刷新时实时校验：签发 token 的设备记录仍存在、账号仍为 active；设备已下线或账号已停用返回 401，需重新登录。
        - 返回的新 refresh_token 应替换本地旧值。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: 登录或上次刷新时获得的 refresh_token
      responses:
        '200':
          description: 刷新成功（message 为「Token 刷新成功」）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: Token 刷新成功 }
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: 新的 JWT 访问令牌
                      refresh_token:
                        type: string
                        description: 新的 JWT 刷新令牌（请替换本地旧值）
                      expires_in:
                        type: integer
                        description: access_token 有效期（秒），默认 7200
                        example: 7200
        '401':
          description: refresh_token 无效或已过期（refresh token 无效或已过期）；设备已下线，请重新登录；账号已被停用或不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 触发限流（每 IP 每分钟 30 次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/profile:
    get:
      tags: [认证]
      summary: 获取本人资料
      description: |-
        【用途】获取当前登录用户自己的资料（SafeUser 白名单字段，不含 password_hash 等敏感信息）。

        【调用时机】进入「我的」页面、登录成功后刷新本地用户缓存时。

        【业务规则与注意事项】
        - 返回字段为服务端白名单（SAFE_USER_FIELDS），任何接口都不会返回密码哈希。
        - force_change_pwd=true 时前端应强制跳转修改密码。
      responses:
        '200':
          description: 成功，data 为本人 SafeUser
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    $ref: '#/components/schemas/SafeUser'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 用户不存在（User not found）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [认证]
      summary: 更新本人资料（均为可选字段）
      description: |-
        【用途】更新当前登录用户的昵称、签名、头像，三个字段均为可选，仅提交的字段会被更新。

        【调用时机】用户在「编辑资料」页保存修改时。

        【业务规则与注意事项】
        - 未传的字段保持不变；不能通过本接口修改手机号、部门、角色等字段。
        - 响应为更新后的完整 SafeUser，前端可直接替换本地缓存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 100
                  description: 显示昵称，最长 100 字符
                  example: 张三
                signature:
                  type: string
                  maxLength: 200
                  description: 个性签名，最长 200 字符
                  example: 保持热爱，奔赴山海
                avatar_url:
                  type: string
                  maxLength: 500
                  description: 头像 URL，最长 500 字符（可先通过 POST /upload 上传获得）
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
      responses:
        '200':
          description: 更新成功（message 为「个人资料更新成功」），data 为更新后的 SafeUser
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 个人资料更新成功 }
                  data:
                    $ref: '#/components/schemas/SafeUser'
        '400':
          description: 参数校验失败（如字段超长）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/devices:
    get:
      tags: [认证]
      summary: 获取本人已登录设备列表
      description: |-
        【用途】列出当前登录用户的全部设备记录（每次登录生成一条），按创建时间倒序。

        【调用时机】「设备管理」页展示当前账号在哪些设备登录过。

        【业务规则与注意事项】
        - 返回的 Device.id 是设备记录主键，用于「下线设备」接口的路径参数；device_id 字段才是设备指纹 UUID，二者不要混淆。
      responses:
        '200':
          description: 成功，data 为 Device 数组（按 created_at 倒序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/devices/{deviceId}/offline:
    post:
      tags: [认证]
      summary: 将本人某台设备强制下线（该设备 token 立即失效）
      description: |-
        【用途】把当前登录用户的指定设备强制下线。

        【调用时机】「设备管理」页中用户主动踢掉某台设备（如发现陌生设备）。

        【业务规则与注意事项】
        - 路径参数 deviceId 为设备记录主键 Device.id（不是设备指纹 device_id），取值来自 GET /auth/devices。
        - 实现方式为删除该设备记录；由于 JWT 守卫每个请求都校验设备存在性，该设备已签发的 token 立即失效（即时强制下线），该设备需重新登录。
        - 仅能操作本人设备（按 user_id + id 条件删除），传他人或不存在的设备 ID 不会报错，仅无实际效果。
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 设备记录主键 Device.id（UUID，非 device_id 设备指纹）
          example: 3f8a2b1c-9d4e-4c5b-a6f7-1e2d3c4b5a69
      responses:
        '200':
          description: 下线成功（message 为「设备已下线」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 设备已下线 }
                  data: { type: object, nullable: true, example: null }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /accounts:
    post:
      tags: [账号]
      summary: 开通单个账号
      description: |-
        【用途】管理员为员工开通单个账号（本系统不开自助注册的唯一开户入口之一）。

        【调用时机】管理后台「添加成员」操作时。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - 手机号必须唯一，重复开通返回 409。
        - password 留空时服务端自动生成 12 位随机密码（去除易混淆字符），并在响应 initial_password 中返回一次，请立即转交员工并妥善保管；指定了 password 时 initial_password 返回的即为所指定值。
        - 新账号初始：role=user、status=active、force_change_pwd=true（员工首登强制改密）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, display_name]
              properties:
                phone:
                  type: string
                  pattern: '^1\d{10}$'
                  description: 手机号（即用户名），1 开头共 11 位数字，全局唯一
                  example: '13900139001'
                display_name:
                  type: string
                  maxLength: 100
                  description: 姓名/显示名，最长 100 字符
                  example: 张三
                department:
                  type: string
                  maxLength: 100
                  description: 部门（可选），最长 100 字符
                  example: 工程部
                password:
                  type: string
                  description: 初始密码（可选）；留空则自动生成 12 位随机密码并在响应中返回一次
                  example: 'Init@2026'
      responses:
        '200':
          description: 开通成功（message 为「账号开通成功」）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 账号开通成功 }
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/SafeUser'
                      initial_password:
                        type: string
                        description: 初始密码（未指定 password 时为服务端生成的随机密码，仅此一次返回，请妥善转交）
                        example: 'aB3#eF7kM9pQ'
        '400':
          description: 参数校验失败（手机号格式不正确、display_name 缺失或超长等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非 admin 角色（Admin access required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 该手机号已开通账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [账号]
      summary: 账号分页列表
      description: |-
        【用途】管理员分页查询全部账号（含已停用），支持按关键字、部门、状态过滤。

        【调用时机】管理后台「成员管理」列表页加载与筛选时。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - keyword 为手机号精确匹配 OR 姓名模糊匹配（LIKE %keyword%）。
        - 按创建时间倒序排列。
        - 响应分页结构为 { data: SafeUser[], total }（注意字段名为 data，不是 list）。
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: 页码，默认 1
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
          description: 每页条数，默认 20，最大 200
          example: 20
        - name: keyword
          in: query
          schema: { type: string }
          description: 关键字，手机号精确匹配或姓名模糊匹配
          example: 张
        - name: department
          in: query
          schema: { type: string }
          description: 按部门精确过滤
          example: 工程部
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
          description: 按状态过滤：active 正常 / disabled 已停用
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        description: 当前页账号列表（SafeUser）
                        items:
                          $ref: '#/components/schemas/SafeUser'
                      total:
                        type: integer
                        description: 满足条件的账号总数
                        example: 137
        '400':
          description: 分页参数校验失败（page/pageSize 非整数或越界）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非 admin 角色（Admin access required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /accounts/batch:
    post:
      tags: [账号]
      summary: JSON 批量开通账号（1~500 条）
      description: |-
        【用途】管理员以 JSON 数组方式批量开通账号。

        【调用时机】管理后台粘贴/录入批量名单后提交时；Excel 文件导入请用 POST /accounts/import。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - 数组长度 1~500，逐条独立开通：单条失败（如手机号已存在）不影响其它条目，失败项在结果中带 error 原因。
        - 每条账号均自动生成 12 位随机初始密码（批量接口不支持指定密码），成功项的 password 字段返回该初始密码，请妥善导出转交。
        - 新账号初始 force_change_pwd=true（首登强制改密）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accounts]
              properties:
                accounts:
                  type: array
                  minItems: 1
                  maxItems: 500
                  description: 待开通账号数组，1~500 条
                  items:
                    type: object
                    required: [phone, display_name]
                    properties:
                      phone:
                        type: string
                        pattern: '^1\d{10}$'
                        description: 手机号，1 开头共 11 位数字
                        example: '13900139002'
                      display_name:
                        type: string
                        maxLength: 100
                        description: 姓名，最长 100 字符
                        example: 李四
                      department:
                        type: string
                        maxLength: 100
                        description: 部门（可选）
                        example: 市场部
      responses:
        '200':
          description: 批量导入完成（message 为「批量导入完成」），data 为逐条结果明细
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 批量导入完成 }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchResult'
        '400':
          description: 参数校验失败（数组为空/超过 500 条、某条手机号格式不正确等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非 admin 角色（Admin access required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /accounts/import:
    post:
      tags: [账号]
      summary: Excel 批量导入账号（xlsx，最大 5MB）
      description: |-
        【用途】管理员上传 Excel（xlsx）文件批量导入账号。

        【调用时机】管理后台选择既有 Excel 名单文件导入时；JSON 方式请用 POST /accounts/batch。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - multipart/form-data 上传，文件字段名 file，仅解析第一个工作表，文件最大 5MB（超出返回 413）。
        - 列名支持中英文：phone/手机号、display_name/姓名、department/部门；phone 与 display_name 必填（无效行被自动过滤），department 可选。
        - 过滤后无有效账号行返回 409；Excel 文件解析失败返回 409。
        - 逐条独立开通，单条失败不影响其它条目；成功账号自动生成随机初始密码并在结果 password 字段返回，新账号 force_change_pwd=true。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: xlsx 文件（最大 5MB）；列名支持 phone/手机号、display_name/姓名、department/部门
      responses:
        '200':
          description: 导入完成（message 为「Excel 导入完成」），data 为逐条结果明细
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: Excel 导入完成 }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchResult'
        '400':
          description: 未接收到文件（未选择文件或字段名不是 file）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非 admin 角色（Admin access required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Excel 文件解析失败，请检查文件格式；或 Excel 中无有效账号行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: 文件超过 5MB 限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /accounts/departments:
    get:
      tags: [账号]
      summary: 部门去重列表
      description: |-
        【用途】获取全公司账号中出现过的部门名（去重、升序），用于筛选下拉框。

        【调用时机】管理后台成员列表页的部门筛选器初始化时。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - 仅统计 department 非空的账号；结果按部门名升序。
      responses:
        '200':
          description: 成功，data 为部门名字符串数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items: { type: string }
                    example: [工程部, 市场部, 财务部]
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非 admin 角色（Admin access required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /accounts/{id}:
    get:
      tags: [账号]
      summary: 账号详情
      description: |-
        【用途】管理员查看指定账号详情。

        【调用时机】管理后台点击某个成员查看/编辑前拉取详情时。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - 返回 SafeUser 白名单字段，不含密码哈希。
      parameters:
        - name: id
