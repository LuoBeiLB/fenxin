  /accounts/{id}/reset-password:
    post:
      tags: [账号]
      summary: 重置指定账号密码
      description: |-
        【用途】管理员重置指定账号的密码。

        【调用时机】员工忘记密码找管理员重置；v1 旧数据迁移后也需通过此接口统一重置（旧版 bcrypt 与现版 Argon2 哈希不兼容）。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - new_password 留空时自动生成 12 位随机密码并在响应中返回一次；指定时响应返回的即为所指定值。
        - 重置后该账号 force_change_pwd=true，员工下次登录将被强制改密。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目标用户 ID（UUID）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  description: 指定新密码（可选）；留空则自动生成随机密码并在响应中返回一次
                  example: 'Reset@2026'
      responses:
        '200':
          description: 重置成功（message 为「密码重置成功」）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 密码重置成功 }
                  data:
                    type: object
                    properties:
                      new_password:
                        type: string
                        description: 新密码（未指定时为服务端生成的随机密码，仅此一次返回）
                        example: 'kX9#mQ2wE8rT'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非 admin 角色（Admin access required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 账号不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /accounts/{id}/toggle-status:
    post:
      tags: [账号]
      summary: 启用/停用账号；停用时删除该账号全部设备记录（全端强制下线）
      description: |-
        【用途】管理员启用或停用指定账号。

        【调用时机】员工离职（停用）或复职/误停恢复（启用）时。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - 停用（status=disabled）时会删除该账号的全部设备记录；由于 JWT 守卫每个请求都实时校验账号状态与设备存在性，该账号所有已签发 token 立即失效，实现全端即时强制下线。
        - 停用账号再登录将返回 401「账号已被停用」。
        - 启用（status=active）仅恢复账号状态，不恢复已删除的设备记录，用户需重新登录。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目标用户 ID（UUID）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
                  description: 目标状态：active 启用 / disabled 停用（停用即全端强制下线）
                  example: disabled
      responses:
        '200':
          description: 更新成功（message 为「状态更新成功」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 状态更新成功 }
                  data: { type: object, nullable: true, example: null }
        '400':
          description: status 缺失或取值非法（仅允许 active/disabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非 admin 角色（Admin access required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 账号不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /audit-logs:
    get:
      tags: [审计日志]
      summary: 审计日志分页查询
      description: |-
        【用途】分页查询系统审计日志，供管理后台「审计日志」页展示：谁在什么时间从哪个 IP 做了什么敏感操作。

        【调用时机】管理后台审计页加载/筛选时。

        【业务规则与注意事项】
        - 仅 admin 角色可调用，普通用户返回 403。
        - 按 created_at 倒序排列（最新在前）。
        - 响应分页结构为 { data: AuditLogItem[], total }（注意字段名为 data，不是 list）。
        - 每条记录附带操作人姓名 user_display_name 与手机号 user_phone；操作人已删除或系统动作（user_id 为空）时为 null。
        - 当前已记录的 action：login 登录、change_password 修改密码、create_account 开通账号、batch_import_accounts 批量导入账号、reset_password 重置密码、enable_account 启用账号、disable_account 停用账号、remove_device 下线设备；后续迭代可能新增，前端展示时建议直接显示原值或做兜底映射。
        - 所有筛选条件可组合；start_time/end_time 支持 ISO 8601 或 YYYY-MM-DD（含边界）。
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: 页码，默认 1
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
          description: 每页条数，默认 20，最大 200
          example: 20
        - name: user_id
          in: query
          schema: { type: string }
          description: 按操作人用户 ID 精确过滤
          example: 9f1c2a7e-3b4d-4e5f-8a9b-1c2d3e4f5a6b
        - name: action
          in: query
          schema: { type: string, enum: [login, change_password, create_account, batch_import_accounts, reset_password, enable_account, disable_account, remove_device] }
          description: 按动作精确过滤
          example: login
        - name: target_type
          in: query
          schema: { type: string }
          description: 按目标类型精确过滤，如 user / device
          example: user
        - name: start_time
          in: query
          schema: { type: string }
          description: 起始时间（含），ISO 8601 或 YYYY-MM-DD
          example: '2026-08-01'
        - name: end_time
          in: query
          schema: { type: string }
          description: 结束时间（含），ISO 8601 或 YYYY-MM-DD
          example: '2026-08-31T23:59:59+08:00'
        - name: keyword
          in: query
          schema: { type: string }
          description: 模糊搜索操作详情 detail（LIKE %keyword%）
          example: 138
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        description: 当前页审计日志列表
                        items:
                          type: object
                          properties:
                            id: { type: string, description: 日志 ID }
                            user_id: { type: string, nullable: true, description: 操作人用户 ID（系统动作为 null） }
                            action: { type: string, description: 动作标识，如 login }
                            target_type: { type: string, nullable: true, description: 目标类型，如 user / device }
                            target_id: { type: string, nullable: true, description: 目标对象 ID }
                            detail: { type: string, nullable: true, description: 操作详情（如目标手机号/设备名） }
                            ip_address: { type: string, nullable: true, description: 操作来源 IP }
                            user_agent: { type: string, nullable: true, description: 操作来源 UA }
                            created_at: { type: string, format: date-time, description: 操作时间 }
                            user_display_name: { type: string, nullable: true, description: 操作人姓名（关联用户表带出） }
                            user_phone: { type: string, nullable: true, description: 操作人手机号（关联用户表带出） }
                      total:
                        type: integer
                        description: 满足条件的日志总数
                        example: 523
        '400':
          description: 参数校验失败（分页参数越界 / start_time / end_time 格式无效）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非 admin 角色（Admin access required）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contacts:
    get:
      tags: [通讯录]
      summary: 企业通讯录分页列表（不含本人）
      description: |-
        【用途】分页浏览企业通讯录（全员名单）。

        【调用时机】App「通讯录」页加载与下拉翻页时。

        【业务规则与注意事项】
        - 仅返回 status=active 的用户，且自动排除本人。
        - keyword 为手机号精确匹配 OR 姓名模糊匹配（LIKE %keyword%）；department 为精确过滤。
        - 按姓名升序排列；pageSize 默认 50（与账号管理列表的默认 20 不同）。
        - 响应分页结构为 { data: SafeUser[], total }。
        - 仅返回 SafeUser 白名单字段，绝不返回 password_hash 等敏感信息。
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
          description: 关键字，手机号精确匹配或姓名模糊匹配
          example: 张
        - name: department
          in: query
          schema: { type: string }
          description: 按部门精确过滤
          example: 工程部
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: 页码，默认 1
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
          description: 每页条数，默认 50
          example: 50
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        description: 当前页通讯录列表（SafeUser）
                        items:
                          $ref: '#/components/schemas/SafeUser'
                      total:
                        type: integer
                        description: 满足条件的总人数
                        example: 86
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contacts/search:
    get:
      tags: [通讯录]
      summary: 通讯录快速搜索（用于选人建会话/拉群）
      description: |-
        【用途】按关键字快速搜索通讯录，一次最多返回 20 条，用于轻量选人场景。

        【调用时机】发起私聊、创建群组/拉人时的选人搜索框。

        【业务规则与注意事项】
        - keyword 必填，为空返回 400「keyword 不能为空」。
        - 匹配规则：手机号精确匹配 OR 姓名模糊匹配；仅返回 status=active 用户并排除本人；上限 20 条。
        - 需要完整翻页浏览时请用 GET /contacts。
      parameters:
        - name: keyword
          in: query
          required: true
          schema: { type: string }
          description: 搜索关键字（必填），手机号精确匹配或姓名模糊匹配
          example: 138
      responses:
        '200':
          description: 成功，data 为 SafeUser 数组（最多 20 条）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SafeUser'
        '400':
          description: keyword 不能为空
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /conversations/private:
    post:
      tags: [会话]
      summary: 创建或获取与某人的私聊会话（幂等）
      description: |-
        【用途】获取（不存在则创建）与指定用户的两人私聊会话。

        【调用时机】从通讯录/搜索结果点击某个联系人进入私聊时。

        【业务规则与注意事项】
        - 幂等：若两人已存在 type=private 的共同会话则直接返回，不会重复创建（共同群聊不会被误判为私聊）。
        - 对方用户必须存在且 status=active，否则返回 404「对方账号不存在或已停用」。
        - 新建会话时双方均为 member 角色，member_count=2。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: 对方用户 ID（UUID），取值来自通讯录/搜索接口的 SafeUser.id
                  example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '200':
          description: 成功，data 为私聊会话 Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    $ref: '#/components/schemas/Conversation'
        '400':
          description: user_id 缺失或不是合法 UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 对方账号不存在或已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /conversations:
    get:
      tags: [会话]
      summary: 我的会话列表（私聊会话附带 other_user）
      description: |-
        【用途】获取当前用户加入的全部会话（私聊/群/频道）。

        【调用时机】App 首页会话列表加载与刷新时。

        【业务规则与注意事项】
        - 排序：按 last_message_at 倒序，无消息的会话排最后。
        - 私聊会话（type=private）额外附带 other_user 字段（对方的 SafeUser），用于展示会话名与头像。
        - 未加入任何会话时返回空数组。
      responses:
        '200':
          description: 成功，data 为 Conversation 数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /conversations/{id}:
    get:
      tags: [会话]
      summary: 会话详情
      description: |-
        【用途】获取指定会话的详情（名称、头像、成员数等）。

        【调用时机】进入聊天页或会话设置页时。

        【业务规则与注意事项】
        - 仅会话成员可访问，非成员返回 403（Access denied to this conversation）。
        - 会话不存在返回 404（校验顺序：先校验成员身份，再查会话本体）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      responses:
        '200':
          description: 成功，data 为 Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    $ref: '#/components/schemas/Conversation'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 会话不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages:
    post:
      tags: [消息]
      summary: 发送消息（文字/图片/语音/视频/文件），支持回复引用与阅后即焚
      description: |-
        【用途】向指定会话发送一条消息，支持文本及图片/语音/视频/文件附件，支持回复引用与阅后即焚。

        【调用时机】聊天页发送消息时；附件类消息需先调 POST /upload 拿到 url 再调本接口。

        【业务规则与注意事项】
        - 仅会话成员可向该会话发消息，非成员返回 403（修复了旧版越权发消息漏洞）。
        - type=text 时 content 必填（400 文本消息 content 不能为空）；type 为 image/voice/video/file 时 file_url 必填（400 xxx 消息 file_url 不能为空）。
        - 阅后即焚：传 destroy_at（ISO8601 绝对时间，如 5 分钟后的时间点），到期由服务端定时任务（每分钟扫描一批，每批最多 500 条）自动销毁——删除该消息全部回执、清空 content 与 file_url、置 is_destroyed=true；消息列表接口另有「到期即不返回」的过滤兜底（双保险）。源码未限定销毁时长的离散枚举，由客户端自行计算目标时间传入。
        - 发送成功后：会话 last_message_at 更新为当前时间（影响会话列表排序）；为除发送者外的每位成员各创建一条消息回执（is_delivered=false, is_read=false）。
        - reply_to_id 传入被回复消息的 Message.id 实现引用回复。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, type]
              properties:
                conversation_id:
                  type: string
                  format: uuid
                  description: 目标会话 ID（UUID）
                  example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
                type:
                  type: string
                  enum: [text, image, voice, video, file]
                  description: 消息类型：text 文本 / image 图片 / voice 语音 / video 视频 / file 文件
                  example: text
                content:
                  type: string
                  description: 文本内容；type=text 时必填
                  example: 会议纪要已发，请查收
                file_url:
                  type: string
                  maxLength: 500
                  description: 附件 URL（POST /upload 返回的 url）；非 text 类型必填，最长 500 字符
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.pdf
                file_name:
                  type: string
                  maxLength: 200
                  description: 附件原始文件名，最长 200 字符
                  example: 会议纪要.pdf
                file_size:
                  type: integer
                  description: 附件大小（字节）
                  example: 204800
                reply_to_id:
                  type: string
                  format: uuid
                  description: 被回复消息的 ID（可选，实现引用回复）
                  example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
                destroy_at:
                  type: string
                  format: date-time
                  description: 阅后即焚销毁时间（ISO8601 绝对时间）；到期后服务端定时任务自动销毁该消息；不传则永久保留
                  example: '2026-08-26T12:05:00.000Z'
      responses:
        '200':
          description: 发送成功（message 为「发送成功」），data 为已入库的 Message
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 发送成功 }
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: 参数校验失败；或 text 消息缺 content；或非 text 消息缺 file_url
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员禁止向该会话发消息（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{conversationId}:
    get:
      tags: [消息]
      summary: 会话消息历史（倒序拉取，已到期销毁的消息被过滤）
      description: |-
        【用途】拉取指定会话的历史消息。

        【调用时机】进入聊天页首次加载（不带 before，拉最新一页）；向上滚动加载更早消息（带 before 游标翻页）。

        【业务规则与注意事项】
        - 仅会话成员可访问，非成员返回 403。
        - 默认返回最新 limit 条（默认 50）；向上翻页时把当前已加载的最旧一条消息的 created_at 作为 before 传入，服务端返回 created_at 早于该时间的消息，实现历史消息游标分页。
        - 返回数组按时间正序（旧→新）排列，便于直接渲染。
        - 已销毁（is_destroyed=true）及已到销毁时间（destroy_at <= 当前时间）的消息不返回，即使定时销毁任务尚未执行（过滤兜底）。
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        - name: before
          in: query
          schema: { type: string, format: date-time }
          description: 分页游标：传当前已加载的最旧一条消息的 created_at（ISO8601），返回早于该时间的消息；不传则拉最新一页
          example: '2026-08-26T08:30:00.000Z'
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
          description: 每页条数，默认 50
          example: 50
      responses:
        '200':
          description: 成功，data 为 Message 数组（按时间正序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}:
    put:
      tags: [消息]
      summary: 编辑消息（置 is_edited=true）
      description: |-
        【用途】编辑自己已发送的消息内容。

        【调用时机】用户在聊天页对自己发出的消息选择「编辑」时。

        【业务规则与注意事项】
        - 仅消息发送者可编辑，非发送者返回 403（You can only edit your own messages）。
        - 时间窗：仅发送后 48 小时内可编辑，超过返回 400（Cannot edit messages older than 48 hours）。
        - 已撤回的消息不可再编辑，返回 400（Cannot edit a recalled message）。
        - 编辑成功后 is_edited=true，前端应展示「已编辑」标记。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: 新的消息内容（必填）
                  example: 会议纪要已更新，请查收
      responses:
        '200':
          description: 编辑成功（message 为「消息已编辑」），data 为更新后的 Message
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 消息已编辑 }
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: content 为空；消息已撤回不可编辑；消息发送超过 48 小时不可编辑
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非消息发送者（You can only edit your own messages）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 消息不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/recall:
    post:
      tags: [消息]
      summary: 撤回消息（置 is_recalled=true）
      description: |-
        【用途】撤回自己已发送的消息。

        【调用时机】用户在聊天页对自己发出的消息选择「撤回」时。

        【业务规则与注意事项】
        - 仅消息发送者可撤回，非发送者返回 403（You can only recall your own messages）。
        - 时间窗：仅发送后 48 小时内可撤回，超过返回 400（Cannot recall messages older than 48 hours）。
        - 撤回为软删除：仅置 is_recalled=true，消息记录与内容仍保留在库中，前端应展示「已撤回」占位。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      responses:
        '200':
          description: 撤回成功（message 为「消息已撤回」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 消息已撤回 }
                  data: { type: object, nullable: true, example: null }
        '400':
          description: 消息发送超过 48 小时不可撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非消息发送者（You can only recall your own messages）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 消息不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/read:
    post:
      tags: [消息]
      summary: 将会话标记为已读（单条 UPDATE，同步本人全部回执）
      description: |-
        【用途】把指定会话标记为已读。

        【调用时机】用户打开某个聊天会话、浏览到最新消息时。

        【业务规则与注意事项】
        - 注意：路径参数 id 为「会话 ID」（与旧版 API 保持一致），不是消息 ID。
        - 仅会话成员可操作，非成员返回 403。
        - 服务端用一条 UPDATE（含子查询）把本人在该会话下全部未读回执置为 is_read=true、read_at=当前时间；并把本人成员记录的 last_read_message_id 更新为该会话最新一条消息。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID（UUID；注意此处不是消息 ID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      responses:
        '200':
          description: 标记成功（message 为「已读标记成功」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 已读标记成功 }
                  data: { type: object, nullable: true, example: null }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/receipt:
    get:
      tags: [消息]
      summary: 消息回执列表（送达/已读明细，含用户姓名）
      description: |-
        【用途】查看一条消息的逐人回执明细（是否送达、是否已读、已读时间）。

        【调用时机】群聊中点击自己消息的「已读/未读」详情时。

        【业务规则与注意事项】
        - 仅该消息所在会话的成员可查看，非成员返回 403（修复了旧版任意用户可查漏洞）。
        - 消息不存在返回 404。
        - 回执在消息发送时为除发送者外的每位成员各创建一条；每条附 user_display_name 便于直接展示。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      responses:
        '200':
          description: 成功，data 为回执数组（含用户姓名）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageReceipt'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 消息不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups:
    post:
      tags: [群组]
      summary: 创建群组或频道，创建者为 owner
      description: |-
        【用途】创建群组（或频道）会话。

        【调用时机】用户在 App 选择「发起群聊/创建频道」并选定初始成员后提交时。

        【业务规则与注意事项】
        - 创建者自动成为群主（role=owner），同时计入成员；member_ids 中即使包含创建者也会被自动去重。
        - member_ids 最多 500 个，每个必须是合法 UUID v4；新加成员角色均为 member。
        - is_channel=true 时创建频道：会话 is_channel 标记为 true（源码中会话 type 恒为 group，频道通过 is_channel 字段区分）。
        - 创建成功后 member_count = 1（创建者）+ 实际初始成员数。
        - 源码未校验 member_ids 对应的用户是否存在/启用，调用方应传入从通讯录获取的有效用户 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: 群名称，最长 200 字符
                  example: 产品评审群
                description:
                  type: string
                  description: 群简介（可选）
                  example: 每周三产品评审同步
                avatar_url:
                  type: string
                  maxLength: 500
                  description: 群头像 URL（可选，可先通过 POST /upload 上传获得），最长 500 字符
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
                member_ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: 初始成员用户 ID 数组（可选，最多 500 个；创建者无需包含在内，重复 ID 自动去重）
                  example: ['7c9e6679-7425-40de-944b-e07fc1f90ae7']
                is_channel:
                  type: boolean
                  description: 是否创建为频道（默认 false 为普通群组）
                  example: false
      responses:
        '200':
          description: 创建成功（message 为「群组创建成功」），data 为会话 Conversation（type=group）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 群组创建成功 }
                  data:
                    $ref: '#/components/schemas/Conversation'
        '400':
          description: 参数校验失败（name 缺失或超长、member_ids 超 500 个或含非法 UUID 等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/{id}:
    put:
      tags: [群组]
      summary: 更新群资料（均为可选字段）
      description: |-
        【用途】更新群名称、简介、头像，三个字段均为可选，仅提交的字段会被更新。

        【调用时机】群主/管理员在群设置页修改资料保存时。

        【业务规则与注意事项】
        - 仅群主（owner）或群管理员（admin）可调用，普通成员返回 403（Only group owner or admin can update group info）。
        - 响应为更新后的完整 Conversation。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: 群名称，最长 200 字符
                  example: 产品评审群（新版）
                description:
                  type: string
                  description: 群简介
                  example: 每周三 14:00 产品评审
                avatar_url:
                  type: string
                  maxLength: 500
                  description: 群头像 URL，最长 500 字符
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
      responses:
        '200':
          description: 更新成功（message 为「群组信息更新成功」），data 为更新后的 Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 群组信息更新成功 }
                  data:
                    $ref: '#/components/schemas/Conversation'
        '400':
          description: 参数校验失败（如字段超长）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 权限不足，仅群主/群管理员可操作（Only group owner or admin can update group info）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/{id}/members:
    get:
      tags: [群组]
      summary: 群成员列表（含成员用户信息）
      description: |-
        【用途】获取群成员列表，每条成员记录附带该成员的姓名与头像。

        【调用时机】打开群聊的成员列表/群设置页时。

        【业务规则与注意事项】
        - 仅本群成员可查看，非成员返回 403（修复了旧版任意用户可查漏洞）。
        - 结果按成员角色 role 字段升序排列；每条在 ConversationMember 基础上附带 user_display_name、user_avatar_url 便于直接展示。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      responses:
        '200':
          description: 成功，data 为群成员数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupMember'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非群成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [群组]
      summary: 批量添加群成员
      description: |-
        【用途】向群内批量添加成员。

        【调用时机】群主/管理员在群设置页「添加成员」选人后提交时。

        【业务规则与注意事项】
        - 仅群主（owner）或群管理员（admin）可调用，普通成员返回 403（Only group owner or admin can add members）。
        - member_ids 必填，最多 500 个，每个必须是合法 UUID v4；新成员角色均为 member。
        - 已在群内的用户 ID 自动跳过（幂等），全部已存在时不做任何变更；添加成功后同步更新会话 member_count。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_ids]
              properties:
                member_ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: 待添加的用户 ID 数组（最多 500 个）
                  example: ['7c9e6679-7425-40de-944b-e07fc1f90ae7']
      responses:
        '200':
          description: 添加成功（message 为「成员添加成功」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 成员添加成功 }
                  data: { type: object, nullable: true, example: null }
        '400':
          description: member_ids 缺失、超 500 个或含非法 UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 权限不足，仅群主/群管理员可操作（Only group owner or admin can add members）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/{id}/members/{userId}:
    delete:
      tags: [群组]
      summary: 移除群成员
      description: |-
        【用途】把指定用户移出群聊。

        【调用时机】群主/管理员在成员列表中执行「移出群聊」时。

        【业务规则与注意事项】
        - 仅群主（owner）或群管理员（admin）可调用（Only group owner or admin can remove members）；源码未对「本人退群」做单独豁免，普通成员调用同样返回 403。
        - 群主不可被移除，尝试移除群主返回 403（Cannot remove the group owner）。
        - 移除成功后同步更新会话 member_count。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 被移除用户 ID（UUID）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '200':
          description: 移除成功（message 为「成员已移除」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 成员已移除 }
                  data: { type: object, nullable: true, example: null }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 权限不足，仅群主/群管理员可操作；或尝试移除群主（Cannot remove the group owner）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/{id}/members/{userId}/role:
    put:
      tags: [群组]
      summary: 设置群成员角色
      description: |-
        【用途】设置指定群成员的角色（设为管理员或降为普通成员）。

        【调用时机】群主在成员列表中「设为管理员/取消管理员」时。

        【业务规则与注意事项】
        - 仅群主（owner）可调用，群管理员也无权设置角色（Only group owner can set admin role）。
        - role 仅允许 admin / member 两种取值（群主身份不可通过本接口转让）。
        - 目标用户必须在群内，否则返回 404（目标用户不在群内）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目标用户 ID（UUID）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member]
                  description: 目标角色：admin 设为管理员 / member 降为普通成员
                  example: admin
      responses:
        '200':
          description: 设置成功（message 为「角色设置成功」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 角色设置成功 }
                  data: { type: object, nullable: true, example: null }
        '400':
          description: role 缺失或取值非法（仅允许 admin/member）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非群主（Only group owner can set admin role）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 目标用户不在群内
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /upload:
    post:
      tags: [文件上传]
      summary: 上传消息附件（图片/语音/视频/文档），最大 50MB，存本地 UPLOAD_DIR
      description: |-
        【用途】上传消息附件（图片/语音/视频/文档等），获得可访问的 URL。

        【调用时机】发送附件类消息前：先调本接口上传文件，再把返回的 url 作为 file_url 调 POST /messages 发消息。

        【业务规则与注意事项】
        - multipart/form-data 上传，文件字段名 file，单文件最大 50MB（超出返回 413）。
        - 文件保存到服务端本地 UPLOAD_DIR（默认 ./uploads），落盘文件名为 <UUID><原扩展名>，通过 /uploads/<filename> 静态路径访问。
        - 返回的 file_name 为原始文件名（服务端已修正中文文件名的 latin1→utf8 编码问题）。
        - Word/Excel 文档由前端端内解析预览；后续迭代将切换 MinIO 对象存储 + 分片断点续传。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 待上传的文件（最大 50MB）
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: 静态访问路径（/uploads/<filename>），发消息时填入 file_url
                        example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.pdf
                      file_name:
                        type: string
                        description: 原始文件名（UTF-8）
                        example: 会议纪要.pdf
                      file_size:
                        type: integer
                        description: 文件大小（字节）
                        example: 204800
        '400':
          description: 未接收到文件（未选择文件或字段名不是 file）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: 文件超过 50MB 限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        JWT access token。登录（POST /auth/login）或刷新（POST /auth/refresh-token）后获得，放入请求头：
        Authorization: Bearer <access_token>
        默认有效期 7200 秒；每个受保护请求都会实时校验账号状态与设备存在性，账号停用或设备下线后 token 立即失效。
  schemas:
    Error:
      type: object
      description: 统一错误响应（code 为 HTTP 状态码；参数校验失败时 message 为多条错误以 '; ' 拼接）
      properties:
        code:
          type: integer
          description: HTTP 状态码（400/401/403/404/409/413/429/500）
          example: 400
        message:
          type: string
          description: 错误描述
          example: 手机号格式不正确
      required: [code, message]

    SafeUser:
      type: object
      description: 对外用户信息（字段白名单，任何接口不会返回 password_hash 等敏感字段）
      properties:
        id:
          type: string
          format: uuid
          description: 用户 ID（UUID v4）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        phone:
          type: string
          description: 手机号（即用户名），1 开头 11 位数字
          example: '13800138000'
        display_name:
          type: string
          description: 显示名/姓名
          example: 张三
        avatar_url:
          type: string
          nullable: true
          description: 头像 URL，未设置为 null
          example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
        signature:
          type: string
          nullable: true
          description: 个性签名，未设置为 null
          example: 保持热爱，奔赴山海
        department:
          type: string
          nullable: true
          description: 部门，未设置为 null
          example: 工程部
        role:
          type: string
          enum: [user, admin]
          description: 角色：user 普通用户 / admin 管理员（可调用账号管理接口）
          example: user
        status:
          type: string
          enum: [active, disabled]
          description: 账号状态：active 正常 / disabled 已停用（停用后 token 立即失效且无法登录）
          example: active
        force_change_pwd:
          type: boolean
          description: 是否需强制改密；true 时前端应强制跳转修改密码（新开通或被重置密码的账号为 true）
          example: false
        created_at:
          type: string
          format: date-time
          description: 创建时间（服务端 datetime）
          example: '2026-08-01T02:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间（服务端 datetime）
          example: '2026-08-20T09:30:00.000Z'

    Device:
      type: object
      description: 已登录设备记录（每次登录生成一条；删除记录即强制下线）
      properties:
        id:
          type: string
          format: uuid
          description: 设备记录主键（下线设备接口用此值）
          example: 3f8a2b1c-9d4e-4c5b-a6f7-1e2d3c4b5a69
        user_id:
          type: string
          format: uuid
          description: 所属用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        device_name:
          type: string
          description: 设备名称（登录时传入，如 iPhone 15）
          example: iPhone 15
        device_type:
          type: string
          enum: [mobile, desktop, tablet, web]
          description: 设备类型：mobile 手机 / desktop 桌面端 / tablet 平板 / web 网页端
          example: mobile
        device_id:
          type: string
          format: uuid
          description: 设备指纹（服务端生成的 UUID，与记录主键 id 不同）
          example: a1b2c3d4-e5f6-4789-8a0b-c1d2e3f4a5b6
        is_online:
          type: boolean
          description: 是否在线
          example: true
        last_active_at:
          type: string
          format: date-time
          nullable: true
          description: 最近活跃时间
          example: '2026-08-26T03:00:00.000Z'
        created_at:
          type: string
          format: date-time
          description: 登录（记录创建）时间
          example: '2026-08-26T03:00:00.000Z'

    Message:
      type: object
      description: 消息对象（阅后即焚消息到期后 content/file_url 被清空且 is_destroyed=true）
      properties:
        id:
          type: string
          format: uuid
          description: 消息 ID（UUID v4）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
        conversation_id:
          type: string
          format: uuid
          description: 所属会话 ID
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        sender_id:
          type: string
          format: uuid
          description: 发送者用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type:
          type: string
          enum: [text, image, voice, video, file]
          description: 消息类型：text 文本 / image 图片 / voice 语音 / video 视频 / file 文件
          example: text
        content:
          type: string
          nullable: true
          description: 文本内容；附件类消息或被销毁后为 null
          example: 会议纪要已发，请查收
        file_url:
          type: string
          nullable: true
          description: 附件 URL（POST /upload 返回）；文本消息或被销毁后为 null
          example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.pdf
        file_name:
          type: string
          nullable: true
          description: 附件原始文件名
          example: 会议纪要.pdf
        file_size:
          type: integer
          nullable: true
          description: 附件大小（字节）
          example: 204800
        reply_to_id:
          type: string
          format: uuid
          nullable: true
          description: 被回复消息的 ID（引用回复），无则 null
          example: null
        is_edited:
          type: boolean
          description: 是否被编辑过（编辑成功后为 true，前端展示「已编辑」）
          example: false
        is_recalled:
          type: boolean
          description: 是否已撤回（撤回为软删除，前端展示「已撤回」占位）
          example: false
        is_destroyed:
          type: boolean
          description: 阅后即焚是否已销毁（销毁后 content/file_url 已清空）
          example: false
        destroy_at:
          type: string
          format: date-time
          nullable: true
          description: 阅后即焚销毁时间，到期服务端自动销毁；非焚毁消息为 null
          example: null
        created_at:
          type: string
          format: date-time
          description: 发送时间（历史消息分页 before 游标传此值）
          example: '2026-08-26T08:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: '2026-08-26T08:00:00.000Z'

    Conversation:
      type: object
      description: 会话对象（私聊/群/频道；私聊在会话列表中附带 other_user）
      properties:
        id:
          type: string
          format: uuid
          description: 会话 ID（UUID v4）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        type:
          type: string
          enum: [private, group, channel]
          description: 会话类型：private 私聊 / group 群组 / channel 频道（源码建群时 type 恒为 group，频道以 is_channel 字段区分）
          example: group
        name:
          type: string
          nullable: true
          description: 会话名称（私聊为 null，前端用 other_user.display_name 展示）
          example: 产品评审群
        description:
          type: string
          nullable: true
          description: 群简介
          example: 每周三产品评审同步
        avatar_url:
          type: string
          nullable: true
          description: 会话头像 URL
          example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
        owner_id:
          type: string
          format: uuid
          nullable: true
          description: 群主用户 ID（群会话），私聊为 null
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        is_channel:
          type: boolean
          description: 是否频道
          example: false
        member_count:
          type: integer
          description: 成员数
          example: 12
        last_message_at:
          type: string
          format: date-time
          nullable: true
          description: 最后一条消息时间（会话列表按此倒序，无消息为 null 排最后）
          example: '2026-08-26T08:00:00.000Z'
        created_at:
          type: string
          format: date-time
          description: 创建时间
          example: '2026-08-01T02:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: '2026-08-26T08:00:00.000Z'
        other_user:
          allOf:
            - $ref: '#/components/schemas/SafeUser'
          nullable: true
          description: 私聊对方用户信息（仅 GET /conversations 会话列表中 type=private 时附带）

    ConversationMember:
      type: object
      description: 会话成员对象
      properties:
        id:
          type: string
          format: uuid
          description: 成员记录主键
          example: 2a3b4c5d-6e7f-48a9-b0c1-d2e3f4a5b6c7
        conversation_id:
          type: string
          format: uuid
          description: 所属会话 ID
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        user_id:
          type: string
          format: uuid
          description: 成员用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        role:
          type: string
          enum: [owner, admin, member]
          description: 群内角色：owner 群主（创建者，可设置管理员）/ admin 群管理员（可改群资料、增删成员）/ member 普通成员
          example: member
        muted:
          type: boolean
          description: 是否免打扰
          example: false
        last_read_message_id:
          type: string
          format: uuid
          nullable: true
          description: 最近已读到的消息 ID（标记已读时更新）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
        joined_at:
          type: string
          format: date-time
          description: 加入时间
          example: '2026-08-01T02:00:00.000Z'

    GroupMember:
      type: object
      description: 群成员列表项（ConversationMember + 成员用户的姓名与头像）
      allOf:
        - $ref: '#/components/schemas/ConversationMember'
        - type: object
          properties:
            user_display_name:
              type: string
              description: 成员显示名（用户不存在时为 Unknown）
              example: 张三
            user_avatar_url:
              type: string
              nullable: true
              description: 成员头像 URL
              example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg

    MessageReceipt:
      type: object
      description: 消息回执（发送时为除发送者外的每位成员各创建一条）
      properties:
        id:
          type: string
          format: uuid
          description: 回执记录主键
          example: 8b9c0d1e-2f3a-44b5-96c7-d8e9f0a1b2c3
        message_id:
          type: string
          format: uuid
          description: 消息 ID
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
        user_id:
          type: string
          format: uuid
          description: 接收者用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        is_delivered:
          type: boolean
          description: 是否已送达
          example: false
        is_read:
          type: boolean
          description: 是否已读
          example: true
        read_at:
          type: string
          format: date-time
          nullable: true
          description: 已读时间，未读为 null
          example: '2026-08-26T08:05:00.000Z'
        created_at:
          type: string
          format: date-time
          description: 回执创建时间（即消息发送时间）
          example: '2026-08-26T08:00:00.000Z'
        user_display_name:
          type: string
          description: 接收者显示名（用户不存在时为 Unknown）
          example: 李四

    BatchResult:
      type: object
      description: 批量开通账号的逐条结果
      properties:
        phone:
          type: string
          description: 手机号
          example: '13900139002'
        display_name:
          type: string
          description: 姓名
          example: 李四
        password:
          type: string
          description: 初始密码（成功时为服务端生成的随机密码，仅此一次返回；失败时为空字符串）
          example: 'kX9#mQ2wE8rT'
        success:
          type: boolean
          description: 该条是否开通成功
          example: true
        error:
          type: string
          description: 失败原因（仅失败项存在，如「该手机号已开通账号」）
          example: 该手机号已开通账号
