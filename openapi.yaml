        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /app-versions/{id}:
    patch:
      tags: [App 版本管理]
      summary: 管理端：修改版本（force / notes / published 撤回恢复）
      description: |-
        【用途】修改一个已发布版本的强更开关、更新说明或发布状态。

        【调用时机】管理后台撤回版本（published=false）、恢复发布、调整强更或修改发版日志时。

        【业务规则与注意事项】
        - 仅 admin 可调用；published=false 为撤回（App 端 latest 接口不再返回该版本，APK 文件保留），true 为恢复发布。
        - 修改 force / published 时通过 WS 广播 app:update 给全部在线用户；操作写入审计日志。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 版本记录 ID（UUID）
          example: 7d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f5a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: 是否强制更新
                  example: true
                notes:
                  type: string
                  maxLength: 2000
                  description: 更新说明
                  example: '1. 修复若干问题
2. 性能优化'
                published:
                  type: boolean
                  description: 发布状态：false=撤回（App 端不再返回该版本），true=恢复发布
                  example: true
      responses:
        '200':
          description: 修改成功（message 为「版本信息已更新」），data 为更新后的 AppVersion
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 版本信息已更新 }
                  data:
                    $ref: '#/components/schemas/AppVersion'
        '400':
          description: 参数校验失败（id 非 UUID 等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 版本记录不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [App 版本管理]
      summary: 管理端：删除版本记录（磁盘 APK 文件保留）
      description: |-
        【用途】删除一条版本记录；磁盘上的 APK 文件保留，避免已分发链接立即失效。

        【调用时机】管理后台「版本管理」删除错误发版记录时。

        【业务规则与注意事项】
        - 仅 admin 可调用；操作写入审计日志。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 版本记录 ID（UUID）
          example: 7d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f5a
      responses:
        '200':
          description: 删除成功（message 为「版本记录已删除」），data 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 版本记录已删除 }
                  data: { nullable: true, example: null }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 版本记录不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /audit-logs:
    get:
      tags: [审计日志]
      summary: 审计日志分页查询（仅管理员，管理后台用）
      description: |-
        【用途】查询系统审计日志（账号开通/重置密码/启停、群组解散、版本发布、公告发布、反馈回复、密钥轮换等敏感操作的留痕）。

        【调用时机】管理后台「审计日志」页检索时。

        【业务规则与注意事项】
        - 仅 admin 可调用，普通用户返回 403。
        - 支持按操作人、动作、目标类型、时间范围与关键词（模糊匹配 detail）组合筛选。
        - 常见 action：login / create_account / reset_password / enable_account / disable_account / remove_device / change_password / batch_import_accounts / publish_announcement / dissolve_group / publish_app_version / reply_feedback / submit_feedback 等。
        - start_time / end_time 支持 ISO 8601 或 YYYY-MM-DD；格式无效返回 400。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 页码，从 1 开始
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
          description: 每页条数 1~200，默认 20
          example: 20
        - name: user_id
          in: query
          schema: { type: string }
          description: 按操作人筛选（用户 ID）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        - name: action
          in: query
          schema: { type: string }
          description: 按动作筛选，如 login / create_account / reset_password / dissolve_group
          example: login
        - name: target_type
          in: query
          schema: { type: string }
          description: 按目标类型筛选，如 user / device / group / announcement
          example: user
        - name: start_time
          in: query
          schema: { type: string }
          description: 起始时间（含），ISO 8601 或 YYYY-MM-DD
          example: '2026-09-01'
        - name: end_time
          in: query
          schema: { type: string }
          description: 结束时间（含），ISO 8601 或 YYYY-MM-DD
          example: '2026-09-04'
        - name: keyword
          in: query
          schema: { type: string }
          description: 模糊搜索操作详情 detail
          example: 重置密码
      responses:
        '200':
          description: '成功，data 为 { data: AuditLog 数组, total: 总数 }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
                      total:
                        type: integer
                        description: 日志总数
                        example: 156
        '400':
          description: start_time / end_time 格式无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contacts:
    get:
      tags: [通讯录]
      summary: 企业通讯录分页列表（不含本人）
      description: |-
        【用途】分页浏览企业通讯录（全员名单）。

        【调用时机】App「通讯录」页加载与下拉翻页时。

        【业务规则与注意事项】
        - 仅返回 status=active 的用户，且自动排除本人。
        - keyword 为手机号精确匹配 OR 姓名模糊匹配（LIKE %keyword%）；department 为精确过滤。
        - 按姓名升序排列；pageSize 默认 50（与账号管理列表的默认 20 不同）。
        - 响应分页结构为 { data: SafeUser[], total }。
        - 仅返回 SafeUser 白名单字段，绝不返回 password_hash 等敏感信息。
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
          description: 关键字，手机号精确匹配或姓名模糊匹配
          example: 张
        - name: department
          in: query
          schema: { type: string }
          description: 按部门精确过滤
          example: 工程部
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: 页码，默认 1
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
          description: 每页条数，默认 50
          example: 50
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        description: 当前页通讯录列表（SafeUser）
                        items:
                          $ref: '#/components/schemas/SafeUser'
                      total:
                        type: integer
                        description: 满足条件的总人数
                        example: 86
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contacts/search:
    get:
      tags: [通讯录]
      summary: 通讯录快速搜索（用于选人建会话/拉群）
      description: |-
        【用途】按关键字快速搜索通讯录，一次最多返回 20 条，用于轻量选人场景。

        【调用时机】发起私聊、创建群组/拉人时的选人搜索框。

        【业务规则与注意事项】
        - keyword 必填，为空返回 400「keyword 不能为空」。
        - 匹配规则：手机号精确匹配 OR 姓名模糊匹配；仅返回 status=active 用户并排除本人；上限 20 条。
        - 需要完整翻页浏览时请用 GET /contacts。
      parameters:
        - name: keyword
          in: query
          required: true
          schema: { type: string }
          description: 搜索关键字（必填），手机号精确匹配或姓名模糊匹配
          example: 138
      responses:
        '200':
          description: 成功，data 为 SafeUser 数组（最多 20 条）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SafeUser'
        '400':
          description: keyword 不能为空
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /conversations/private:
    post:
      tags: [会话]
      summary: 创建或获取与某人的私聊会话（幂等）
      description: |-
        【用途】获取（不存在则创建）与指定用户的两人私聊会话。

        【调用时机】从通讯录/搜索结果点击某个联系人进入私聊时。

        【业务规则与注意事项】
        - 幂等：若两人已存在 type=private 的共同会话则直接返回，不会重复创建（共同群聊不会被误判为私聊）。
        - 对方用户必须存在且 status=active，否则返回 404「对方账号不存在或已停用」。
        - 新建会话时双方均为 member 角色，member_count=2。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: 对方用户 ID（UUID），取值来自通讯录/搜索接口的 SafeUser.id
                  example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '200':
          description: 成功，data 为私聊会话 Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    $ref: '#/components/schemas/Conversation'
        '400':
          description: user_id 缺失或不是合法 UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 对方账号不存在或已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /conversations:
    get:
      tags: [会话]
      summary: 我的会话列表（私聊会话附带 other_user）
      description: |-
        【用途】获取当前用户加入的全部会话（私聊/群/频道）。

        【调用时机】App 首页会话列表加载与刷新时。

        【业务规则与注意事项】
        - 排序：按 last_message_at 倒序，无消息的会话排最后。
        - 私聊会话（type=private）额外附带 other_user 字段（对方的 SafeUser），用于展示会话名与头像。
        - 未加入任何会话时返回空数组。
      responses:
        '200':
          description: 成功，data 为 Conversation 数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /conversations/{id}:
    get:
      tags: [会话]
      summary: 会话详情
      description: |-
        【用途】获取指定会话的详情（名称、头像、成员数等）。

        【调用时机】进入聊天页或会话设置页时。

        【业务规则与注意事项】
        - 仅会话成员可访问，非成员返回 403（Access denied to this conversation）。
        - 会话不存在返回 404（校验顺序：先校验成员身份，再查会话本体）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      responses:
        '200':
          description: 成功，data 为 Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    $ref: '#/components/schemas/Conversation'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 会话不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /channels:
    post:
      tags: [个人频道]
      summary: 创建我的频道（一人一个），创建者自动成为频道主
      description: |-
        【用途】创建属于当前用户的个人频道（个人空间，订阅后可看内容流）。

        【调用时机】用户首次进入「我的频道」页选择创建频道时。

        【业务规则与注意事项】
        - 一人只能拥有一个活跃频道；重复创建返回 409（你已创建过频道，一人只能拥有一个频道）。已解散的频道不挡重建。
        - 创建者自动成为频道成员（role=owner），member_count=1。
        - 创建成功通过 WS 推送 conversation:updated（reason=created），本人会话列表立即出现该频道。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 频道名称（个人空间的名字），1~200 字符
                  example: 萝卜的实验室
                description:
                  type: string
                  maxLength: 1000
                  description: 个人描述：对外展示在频道广场与详情页，最长 1000 字符
                  example: 折腾加密通讯的日常，欢迎围观
                avatar_url:
                  type: string
                  maxLength: 500
                  description: 频道头像 URL，最长 500 字符
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
      responses:
        '200':
          description: 创建成功（message 为「频道创建成功」），data 为频道 Conversation（type=channel）附 is_owner / is_subscribed / owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 频道创建成功 }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Conversation'
                      - type: object
                        properties:
                          is_owner:
                            type: boolean
                            description: 当前用户是否频道主（创建接口恒为 true）
                            example: true
                          is_subscribed:
                            type: boolean
                            description: 当前用户是否已订阅（频道主恒为 true）
                            example: true
                          owner:
                            allOf:
                              - $ref: '#/components/schemas/ChannelOwner'
                            nullable: true
                            description: 频道主公开信息（安全字段白名单，不含手机号）
        '400':
          description: 参数校验失败（name 缺失或超长等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 已创建过频道，一人只能拥有一个频道
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /channels/mine:
    get:
      tags: [个人频道]
      summary: 我的频道资料（未创建返回 404，前端引导去创建）
      description: |-
        【用途】获取当前用户自己的频道资料（频道主视角）。

        【调用时机】进入「我的频道」管理页时。

        【业务规则与注意事项】
        - 未创建或已解散返回 404（你还没有创建频道），前端引导去创建/重建。
        - 返回结构同创建接口：Conversation（type=channel）+ is_owner=true + is_subscribed=true + owner。
      responses:
        '200':
          description: 成功，data 为我的频道 Conversation（附 is_owner / is_subscribed / owner）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Conversation'
                      - type: object
                        properties:
                          is_owner:
                            type: boolean
                            description: 是否频道主（本接口恒为 true）
                            example: true
                          is_subscribed:
                            type: boolean
                            description: 是否已订阅（本接口恒为 true）
                            example: true
                          owner:
                            allOf:
                              - $ref: '#/components/schemas/ChannelOwner'
                            nullable: true
                            description: 频道主公开信息
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 你还没有创建频道
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /channels/discover:
    get:
      tags: [个人频道]
      summary: 频道广场：全部公开频道 + 我的订阅状态，热门优先，分页
      description: |-
        【用途】频道广场列表：展示全部公开（visibility=public）且未解散的频道，附当前用户的订阅状态。

        【调用时机】App「频道广场」页加载与翻页时。

        【业务规则与注意事项】
        - 排序：按 member_count（订阅数）倒序，同订阅数按创建时间倒序（热门优先）。
        - 私密频道（visibility=private）不进广场。
        - is_subscribed 标记当前用户是否已订阅该频道。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 页码，从 1 开始
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: 每页数量 1~100，默认 20
          example: 20
      responses:
        '200':
          description: '成功，data 为 { items: 频道摘要数组, total, page, pageSize }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: 频道（会话）ID
                              example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
                            name:
                              type: string
                              description: 频道名称
                              example: 萝卜的实验室
                            description:
                              type: string
                              nullable: true
                              description: 个人描述
                              example: 折腾加密通讯的日常，欢迎围观
                            avatar_url:
                              type: string
                              nullable: true
                              description: 频道头像 URL
                              example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
                            member_count:
                              type: integer
                              description: 订阅数
                              example: 128
                            created_at:
                              type: string
                              format: date-time
                              description: 创建时间
                              example: '2026-09-01T02:00:00.000Z'
                            is_owner:
                              type: boolean
                              description: 当前用户是否该频道主
                              example: false
                            is_subscribed:
                              type: boolean
                              description: 当前用户是否已订阅
                              example: false
                            owner:
                              allOf:
                                - $ref: '#/components/schemas/ChannelOwner'
                              nullable: true
                              description: 频道主公开信息
                      total:
                        type: integer
                        description: 公开频道总数
                        example: 42
                      page:
                        type: integer
                        description: 当前页码
                        example: 1
                      pageSize:
                        type: integer
                        description: 每页数量
                        example: 20
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /channels/{id}:
    get:
      tags: [个人频道]
      summary: 频道详情（任何人可见元信息；消息走 /messages/{conversationId}）
      description: |-
        【用途】获取指定频道的公开元信息（名称、描述、订阅数、频道主、可见性）与当前用户的订阅状态。

        【调用时机】频道广场点进频道详情页时。

        【业务规则与注意事项】
        - 任何登录用户可见（未订阅也返回元信息）；消息内容不在本接口返回，未订阅者调 GET /messages/{conversationId} 会被 403。
        - 频道不存在或已解散返回 404（已解散频道对详情/订阅/退订/修改均不可见）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 频道（会话）ID（UUID）
          example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
      responses:
        '200':
          description: 成功，data 为频道详情对象
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: 频道（会话）ID
                        example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
                      name:
                        type: string
                        description: 频道名称
                        example: 萝卜的实验室
                      description:
                        type: string
                        nullable: true
                        description: 个人描述
                        example: 折腾加密通讯的日常，欢迎围观
                      avatar_url:
                        type: string
                        nullable: true
                        description: 频道头像 URL
                        example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
                      member_count:
                        type: integer
                        description: 订阅数
                        example: 128
                      visibility:
                        type: string
                        enum: [public, private]
                        description: 频道可见性：public 公开 / private 私密
                        example: public
                      ai_enabled:
                        type: boolean
                        description: AI 成员开关（P2 预留）
                        example: false
                      created_at:
                        type: string
                        format: date-time
                        description: 创建时间
                        example: '2026-09-01T02:00:00.000Z'
                      last_message_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 最后一条消息时间
                        example: '2026-09-04T08:00:00.000Z'
                      is_owner:
                        type: boolean
                        description: 当前用户是否该频道主
                        example: false
                      is_subscribed:
                        type: boolean
                        description: 当前用户是否已订阅
                        example: false
                      owner:
                        allOf:
                          - $ref: '#/components/schemas/ChannelOwner'
                        nullable: true
                        description: 频道主公开信息（安全字段白名单，不含手机号）
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 频道不存在（或已解散）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [个人频道]
      summary: 修改频道资料（仅频道主）
      description: |-
        【用途】频道主修改自己频道的名称、描述、头像或可见性。

        【调用时机】「我的频道」设置页保存资料时。

        【业务规则与注意事项】
        - 仅频道主可修改，非频道主返回 403（仅频道主可以修改频道资料）。
        - 均为可选字段，只更新传入的字段。
        - 资料变更通过 WS 推送 conversation:updated（reason=updated）给全部订阅者，广场卡片/频道头部即时刷新。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 频道（会话）ID（UUID）
          example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 频道名称
                  example: 萝卜的实验室
                description:
                  type: string
                  maxLength: 1000
                  description: 个人描述
                  example: 折腾加密通讯的日常，欢迎围观
                avatar_url:
                  type: string
                  maxLength: 500
                  description: 频道头像 URL
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
                visibility:
                  type: string
                  enum: [public, private]
                  description: '频道可见性：public=进广场可自主订阅；private=不进广场（P1 支持邀请链接订阅）'
                  example: public
      responses:
        '200':
          description: 修改成功（message 为「频道资料已更新」），data 为更新后的频道 Conversation（附 is_owner / is_subscribed / owner）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 频道资料已更新 }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Conversation'
                      - type: object
                        properties:
                          is_owner:
                            type: boolean
                            description: 是否频道主（本接口恒为 true）
                            example: true
                          is_subscribed:
                            type: boolean
                            description: 是否已订阅（本接口恒为 true）
                            example: true
                          owner:
                            allOf:
                              - $ref: '#/components/schemas/ChannelOwner'
                            nullable: true
                            description: 频道主公开信息
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非频道主（仅频道主可以修改频道资料）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 频道不存在（或已解散）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [个人频道]
      summary: 解散频道（仅频道主）：解散即焚
      description: |-
        【用途】频道主解散自己的频道。

        【调用时机】「我的频道」设置页选择解散频道时。

        【业务规则与注意事项】
        - 仅频道主可解散，非频道主返回 403。
        - 解散即焚：订阅者的会话列表立即移除，内容流随后物理清除（删除操作写入审计日志）。
        - 解散后频道对详情/订阅/退订/修改接口均不可见（404）；已解散的频道不挡频道主重新创建。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 频道（会话）ID（UUID）
          example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
      responses:
        '200':
          description: 解散成功（message 为「频道已解散」），data 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 频道已解散 }
                  data: { nullable: true, example: null }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非频道主
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 频道不存在（或已解散）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /channels/{id}/subscribe:
    post:
      tags: [个人频道]
      summary: 订阅频道（仅公开频道，幂等）
      description: |-
        【用途】订阅一个公开频道，订阅后会话列表出现该频道、可拉取内容流。

        【调用时机】频道广场或频道详情页点「订阅」时。

        【业务规则与注意事项】
        - 仅公开频道（visibility=public）可自主订阅；私密频道返回 403（私密频道暂不支持自主订阅）。
        - 幂等：已订阅直接返回成功，不重复计数。
        - 订阅成功 member_count+1，并通过 WS 推送 conversation:updated（reason=subscribed），会话列表立即出现该频道。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 频道（会话）ID（UUID）
          example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
      responses:
        '200':
          description: '订阅成功（message 为「订阅成功」），data 为 { conversation_id, subscribed: true }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 订阅成功 }
                  data:
                    type: object
                    properties:
                      conversation_id:
                        type: string
                        format: uuid
                        description: 频道（会话）ID
                        example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
                      subscribed:
                        type: boolean
                        description: 订阅状态，恒为 true
                        example: true
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 私密频道暂不支持自主订阅
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 频道不存在（或已解散）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [个人频道]
      summary: 退订频道（幂等；频道主不可退订自己的频道）
      description: |-
        【用途】退订一个已订阅的频道。

        【调用时机】频道详情页点「退订」或会话列表移除频道时。

        【业务规则与注意事项】
        - 幂等：未订阅时直接返回成功。
        - 频道主不能退订自己的频道，返回 400（频道主不能退订自己的频道）。
        - 退订成功 member_count-1，并通过 WS 推送 conversation:updated（reason=unsubscribed）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 频道（会话）ID（UUID）
          example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
      responses:
        '200':
          description: '退订成功（message 为「已退订」），data 为 { conversation_id, subscribed: false }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 已退订 }
                  data:
                    type: object
                    properties:
                      conversation_id:
                        type: string
                        format: uuid
                        description: 频道（会话）ID
                        example: 8e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a6b
                      subscribed:
                        type: boolean
                        description: 订阅状态，恒为 false
                        example: false
        '400':
          description: 频道主不能退订自己的频道
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 频道不存在（或已解散）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /feedback:
    post:
      tags: [意见反馈]
      summary: 提交意见反馈（contact 可选，自愿留联系方式便于回访）
      description: |-
        【用途】用户向管理后台提交一条意见反馈。

        【调用时机】App「设置-意见反馈」页提交时。

        【业务规则与注意事项】
        - content 必填，最长 2000 字符；contact 可选（最长 100 字符），自愿留下便于管理员回访。
        - 提交后状态为 pending；操作写入审计日志（submit_feedback）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 2000
                  description: 意见内容，最长 2000 字符
                  example: 希望群聊支持按部门批量拉人，每次手动加人太麻烦了。
                contact:
                  type: string
                  maxLength: 100
                  description: 用户自愿留下的联系方式，便于管理员回访（可选）
                  example: '13800138000'
      responses:
        '200':
          description: 提交成功（message 为「反馈提交成功」），data 为 { id, created_at }
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 反馈提交成功 }
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: 反馈记录 ID
                        example: 9f4a5b6c-7d8e-4f9a-0b1c-2d3e4f5a6b7c
                      created_at:
                        type: string
                        format: date-time
                        description: 提交时间
                        example: '2026-09-04T08:30:00.000Z'
        '400':
          description: 参数校验失败（content 缺失或超长等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /feedback/my:
    get:
      tags: [意见反馈]
      summary: 我的反馈列表（含管理员回复），倒序分页
      description: |-
        【用途】查看当前用户自己提交过的反馈及管理员回复。

        【调用时机】App「意见反馈」页「我的反馈」列表加载与翻页时。

        【业务规则与注意事项】
        - 按提交时间倒序分页；管理员已回复的条目带 admin_reply / replied_at。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 页码，从 1 开始
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
          description: 每页条数，默认 20
          example: 20
      responses:
        '200':
          description: '成功，data 为 { data: Feedback 数组, total: 总数 }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Feedback'
                      total:
                        type: integer
                        description: 我的反馈总数
                        example: 5
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /feedback/admin/all:
    get:
      tags: [意见反馈]
      summary: 管理端：全量反馈列表（附提交人姓名/部门），可按状态筛选
      description: |-
        【用途】管理后台查看全部用户反馈，附提交人显示名与部门，可按处理状态筛选。

        【调用时机】管理后台「意见反馈」处理页加载与翻页时。

        【业务规则与注意事项】
        - 仅 admin 可调用，普通用户返回 403。
        - status 可选筛选：pending 待处理 / processed 已处理；按提交时间倒序分页。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 页码，从 1 开始
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
          description: 每页条数，默认 20
          example: 20
        - name: status
          in: query
          schema: { type: string, enum: [pending, processed] }
          description: 按处理状态筛选：pending 待处理 / processed 已处理
          example: pending
      responses:
        '200':
          description: '成功，data 为 { data: 反馈数组（附提交人信息）, total: 总数 }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Feedback'
                            - type: object
                              properties:
                                user_display_name:
                                  type: string
                                  description: 提交人显示名（用户不存在时为 Unknown）
                                  example: 张三
                                user_department:
                                  type: string
                                  nullable: true
                                  description: 提交人部门，未设置为 null
                                  example: 工程部
                      total:
                        type: integer
                        description: 反馈总数（按筛选条件）
                        example: 23
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /feedback/admin/{id}/reply:
    put:
      tags: [意见反馈]
      summary: 管理端：回复反馈（回复即处理，状态自动置为 processed）
      description: |-
        【用途】管理员回复一条用户反馈；回复后该反馈状态自动置为 processed。

        【调用时机】管理后台「意见反馈」处理页填写回复并提交时。

        【业务规则与注意事项】
        - 仅 admin 可调用；反馈不存在返回 404。
        - 回复即处理：status 置 processed，写入 admin_reply / replied_by / replied_at；操作写入审计日志（reply_feedback）。
        - 用户在 GET /feedback/my 中即可看到回复内容。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 反馈记录 ID（UUID）
          example: 9f4a5b6c-7d8e-4f9a-0b1c-2d3e4f5a6b7c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply:
                  type: string
                  maxLength: 2000
                  description: 回复内容，最长 2000 字符
                  example: 已收到，该功能已列入下个版本计划，感谢反馈！
      responses:
        '200':
          description: 回复成功（message 为「回复成功」），data 为更新后的 Feedback（status=processed）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 回复成功 }
                  data:
                    $ref: '#/components/schemas/Feedback'
        '400':
          description: 参数校验失败（reply 缺失或超长）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 反馈不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages:
    post:
      tags: [消息]
      summary: 发送消息（文字/图片/语音/视频/文件），支持回复引用与阅后即焚
      description: |-
        【用途】向指定会话发送一条消息，支持文本及图片/语音/视频/文件附件，支持回复引用与阅后即焚。

        【调用时机】聊天页发送消息时；附件类消息需先调 POST /upload 拿到 url 再调本接口。

        【业务规则与注意事项】
        - 仅会话成员可向该会话发消息，非成员返回 403（修复了旧版越权发消息漏洞）。
        - type=text 时 content 必填（400 文本消息 content 不能为空）；type 为 image/voice/video/file 时 file_url 必填（400 xxx 消息 file_url 不能为空）。
        - 阅后即焚：传 destroy_at（ISO8601 绝对时间，如 5 分钟后的时间点），到期由服务端定时任务（每分钟扫描一批，每批最多 500 条）自动销毁——删除该消息全部回执、清空 content 与 file_url、置 is_destroyed=true；消息列表接口另有「到期即不返回」的过滤兜底（双保险）。源码未限定销毁时长的离散枚举，由客户端自行计算目标时间传入。
        - 发送成功后：会话 last_message_at 更新为当前时间（影响会话列表排序）；为除发送者外的每位成员各创建一条消息回执（is_delivered=false, is_read=false）。
        - reply_to_id 传入被回复消息的 Message.id 实现引用回复。
        - 点开才焚（v5.9.3）：传 burn_ttl_seconds（秒数）而非 destroy_at——焚毁消息对全员（含发送方）先显示马赛克占位，接收方调 POST /messages/{id}/reveal 才下发内容并开始各自倒计时；音视频消息可同时传 media_duration_seconds 保证播完才焚。
        - E2E 端到端加密：同时传 sender_ephemeral_pubkey / cipher_nonce / cipher_text 三字段（接收方用 GET /keys/{userId} 拿发送方身份公钥做 ECDH 解密）；加密消息 content 仅为占位提示。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, type]
              properties:
                conversation_id:
                  type: string
                  format: uuid
                  description: 目标会话 ID（UUID）
                  example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
                type:
                  type: string
                  enum: [text, image, voice, video, file]
                  description: 消息类型：text 文本 / image 图片 / voice 语音 / video 视频 / file 文件
                  example: text
                content:
                  type: string
                  description: 文本内容；type=text 时必填
                  example: 会议纪要已发，请查收
                file_url:
                  type: string
                  maxLength: 500
                  description: 附件 URL（POST /upload 返回的 url）；非 text 类型必填，最长 500 字符
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.pdf
                file_name:
                  type: string
                  maxLength: 200
                  description: 附件原始文件名，最长 200 字符
                  example: 会议纪要.pdf
                file_size:
                  type: integer
                  description: 附件大小（字节）
                  example: 204800
                media_duration_seconds:
                  type: integer
                  minimum: 1
                  maximum: 7200
                  description: 音视频时长（秒，v5.8.9 播完才焚）：语音=录音时长、视频=播放器 metadata duration。焚毁消息点开后的消费窗口 = max(burn_ttl_seconds, media_duration_seconds + 缓冲30s)，确保播完才焚；不传则 reveal 时走默认窗口
                  example: 30
                file_original_url:
                  type: string
                  maxLength: 500
                  description: 原图地址（v5.8.7 双上传策略）：file_url 为前端压缩版时，此字段存原图供下载原图；发送时可直接带，也可事后 PATCH /messages/{id}/original-file 补传回填，最长 500 字符
                  example: /uploads/4f8a2b1c-9d4e-4c5b-a6f7-1e2d3c4b5a70.jpg
                reply_to_id:
                  type: string
                  format: uuid
                  description: 被回复消息的 ID（可选，实现引用回复）
                  example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
                destroy_at:
                  type: string
                  format: date-time
                  description: 定时销毁时间（ISO8601 绝对时间）：不传 burn_ttl_seconds 时为主焚毁机制，到期后服务端定时任务自动销毁该消息；传了 burn_ttl_seconds 时本字段为兜底强制焚毁时间（服务端按 created_at + 兜底小时数生成，可不传）；都不传则永久保留
                  example: '2026-08-26T12:05:00.000Z'
                burn_ttl_seconds:
                  type: number
                  description: 点开才焚（阅后即焚 v2）：点开查看后多少秒焚毁（如 5）。不传 = 普通消息。焚毁消息对全员（含发送方）先显示马赛克占位，调 POST /messages/{id}/reveal 才下发内容并开始各自倒计时（与 destroy_at 定时销毁是两套机制，二选一）
                  example: 5
                mentions:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
                  description: '@提及：被@的成员用户 ID 数组（前端 @ 选人后传入）。仅保留会话成员，非成员/重复 uid 自动过滤；前端据此精确判定「有人@我」'
                  example: ['5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0']
                sender_ephemeral_pubkey:
                  type: string
                  minLength: 44
                  maxLength: 44
                  description: E2E 加密：发送方临时 X25519 公钥（base64，44 字符）。三个加密字段（sender_ephemeral_pubkey / cipher_nonce / cipher_text）必须同时提供
                  example: MCowBQYDK2VuAyEAj1Zs8a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4=
                cipher_nonce:
                  type: string
                  minLength: 16
                  maxLength: 16
                  description: E2E 加密：AES-256-GCM nonce（base64，16 字符，即 12 字节 nonce 的 base64 编码）
                  example: qaJ0Lp3VvN2xWm9y
                cipher_text:
                  type: string
                  description: E2E 加密：AES-256-GCM 密文 + auth tag（base64）。加密后 content 仅为占位提示（如「[加密消息]」）
      responses:
        '200':
          description: 发送成功（message 为「发送成功」），data 为已入库的 Message
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 发送成功 }
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: 参数校验失败；或 text 消息缺 content；或非 text 消息缺 file_url
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员禁止向该会话发消息（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/search:
    get:
      tags: [消息]
      summary: 全局消息搜索（v5.8.5）：跨我所在的全部会话，MySQL FULLTEXT 全文检索
      description: |-
        【用途】跨「我所在的全部会话」搜索关键词，可传 conversation_id 限定单会话；返回带摘要的命中列表。

        【调用时机】App 顶部全局搜索框输入关键词搜索时。

        【业务规则与注意事项】
        - 引擎：MySQL FULLTEXT + ngram 二元分词（索引覆盖 content 与 file_name 列）；文本消息命中 content，图片/语音/视频/文件消息命中 file_name。
        - 权限在 SQL 层焊死：INNER JOIN conversation_members，仅搜我是成员的会话，杜绝跨会话泄露；传 conversation_id 时先校验成员身份（非成员 403，与老会话内搜索一致）。
        - keyword trim 后 2~64 字符（ngram 最小切 2 字，单字返回 400）；BOOLEAN MODE 操作符（+ - > < ( ) ~ * " @）会被自动清洗。
        - 过滤：加密消息（服务端无明文）、已焚毁（is_destroyed / destroy_at 到期）、点开才焚（burn_ttl_seconds 非空，防搜索泄露受保护内容）、已撤回消息均不返回。
        - after / before 支持 ISO8601 字符串或毫秒时间戳，格式无效返回 400。
      parameters:
        - name: keyword
          in: query
          required: true
          schema: { type: string }
          description: 搜索关键词（trim 后 2~64 字符；单字无法命中 ngram 二元分词，返回 400）
          example: 项目进度
        - name: conversation_id
          in: query
          schema: { type: string, format: uuid }
          description: 限定会话 ID（UUID）；不传 = 搜索我所在的全部会话
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 页码，从 1 开始
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
          description: 每页条数 1~50，默认 20
          example: 20
        - name: after
          in: query
          schema: { type: string }
          description: 时间范围下界（ISO8601 日期或毫秒时间戳），只返回该时刻之后的消息
          example: '2026-09-01T00:00:00.000Z'
        - name: before
          in: query
          schema: { type: string }
          description: 时间范围上界（ISO8601 日期或毫秒时间戳），只返回该时刻之前的消息
          example: '2026-09-04T00:00:00.000Z'
      responses:
        '200':
          description: '成功，data 为 { list: 命中列表（含摘要）, total, page, pageSize }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: 命中消息 ID
                              example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
                            conversation_id:
                              type: string
                              format: uuid
                              description: 所属会话 ID
                              example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
                            sender_id:
                              type: string
                              format: uuid
                              description: 发送者用户 ID
                              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                            sender_name:
                              type: string
                              description: 发送者显示名（不存在时为 Unknown）
                              example: 张三
                            content_snippet:
                              type: string
                              description: 命中摘要（文本消息取 content、媒体消息取 file_name，关键词高亮片段）
                              example: 本周[项目进度]已同步至看板
                            type:
                              type: string
                              enum: [text, image, voice, video, file]
                              description: 消息类型
                              example: text
                            is_encrypted:
                              type: boolean
                              description: 是否加密消息（本接口恒为 false，加密消息不参与搜索）
                              example: false
                            created_at:
                              type: string
                              format: date-time
                              description: 消息时间
                              example: '2026-09-04T08:00:00.000Z'
                      total:
                        type: integer
                        description: 命中总数
                        example: 17
                      page:
                        type: integer
                        description: 当前页码
                        example: 1
                      pageSize:
                        type: integer
                        description: 每页条数
                        example: 20
        '400':
          description: 关键词至少 2 个字符 / 过长（最长 64 字符）/ 包含非法字符；after / before 格式无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 传了 conversation_id 但非该会话成员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{conversationId}:
    get:
      tags: [消息]
      summary: 会话消息历史（倒序拉取，已到期销毁的消息被过滤）
      description: |-
        【用途】拉取指定会话的历史消息。

        【调用时机】进入聊天页首次加载（不带 before，拉最新一页）；向上滚动加载更早消息（带 before 游标翻页）。

        【业务规则与注意事项】
        - 仅会话成员可访问，非成员返回 403。
        - 默认返回最新 limit 条（默认 50）；向上翻页时把当前已加载的最旧一条消息的 created_at 作为 before 传入，服务端返回 created_at 早于该时间的消息，实现历史消息游标分页。
        - 返回数组按时间正序（旧→新）排列，便于直接渲染。
        - 已销毁（is_destroyed=true）及已到销毁时间（destroy_at <= 当前时间）的消息不返回，即使定时销毁任务尚未执行（过滤兜底）。
        - 点开才焚（burn_ttl_seconds 非空）的消息按当前用户回执状态返回：未点开 → 马赛克占位（is_blurred=true，content/file_url/加密字段全部置 null）；已点开未到期 → 完整内容 + burn_at + remain_seconds（前端据此跑本地倒计时）；已到期 → 整条不返回（对该用户而言已焚毁）。
        - mentions 字段保证为数组（存量 null 归一化为 []）；加密消息 content 为占位提示，明文需客户端解密。
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        - name: before
          in: query
          schema: { type: string, format: date-time }
          description: 分页游标：传当前已加载的最旧一条消息的 created_at（ISO8601），返回早于该时间的消息；不传则拉最新一页
          example: '2026-08-26T08:30:00.000Z'
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
          description: 每页条数，默认 50
          example: 50
      responses:
        '200':
          description: 成功，data 为 Message 数组（按时间正序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{conversationId}/search:
    get:
      tags: [消息]
      summary: 会话内历史消息搜索（keyword 模糊匹配，仅明文消息）
      description: |-
        【用途】在指定会话内按关键词搜索历史消息（LIKE 模糊匹配），命中按时间正序返回。

        【调用时机】聊天页顶部的「在聊天中查找」搜索框输入关键词时。

        【业务规则与注意事项】
        - 仅会话成员可访问，非成员返回 403；keyword 必填（trim 后非空，最长 100 字符）。
        - E2EE 加密消息不参与搜索（密文存 cipher_text，content 只是占位符）——仅搜明文消息（is_encrypted=false）。
        - 点开才焚消息（burn_ttl_seconds 非空）不参与搜索，防止搜索泄露马赛克内容。
        - 已销毁（is_destroyed）及已到销毁时间（destroy_at <= 当前时间）的消息不返回（与历史消息列表过滤一致）。
        - limit 默认 50，服务端二次兜底上限 200；before 支持 ISO8601 字符串或毫秒时间戳（UUID 不行，格式错误返回 400）。
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        - name: keyword
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
          description: 搜索关键词（trim 后不能为空，最长 100 字符）
          example: 会议纪要
        - name: before
          in: query
          schema: { type: string }
          description: 分页游标：只返回 created_at 早于该时刻的消息（ISO8601 字符串或毫秒时间戳）
          example: '2026-09-04T08:30:00.000Z'
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
          description: 单次返回条数，默认 50（服务端上限 200）
          example: 50
      responses:
        '200':
          description: 成功，data 为 Message 数组（按时间正序，仅明文且未焚毁消息）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '400':
          description: keyword 为空 / 超过 100 字符；before 参数格式错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}:
    put:
      tags: [消息]
      summary: 编辑消息（置 is_edited=true）
      description: |-
        【用途】编辑自己已发送的消息内容。

        【调用时机】用户在聊天页对自己发出的消息选择「编辑」时。

        【业务规则与注意事项】
        - 仅消息发送者可编辑，非发送者返回 403（You can only edit your own messages）。
        - 时间窗：仅发送后 48 小时内可编辑，超过返回 400（Cannot edit messages older than 48 hours）。
        - 已撤回的消息不可再编辑，返回 400（Cannot edit a recalled message）。
        - 焚毁消息（burn_ttl_seconds 非空）不支持编辑，返回 400（焚毁消息不支持编辑）——内容只在点开时下发，编辑会破坏「点开才焚」计时语义。
        - 编辑成功后 is_edited=true，前端应展示「已编辑」标记。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: 新的消息内容（必填）
                  example: 会议纪要已更新，请查收
      responses:
        '200':
          description: 编辑成功（message 为「消息已编辑」），data 为更新后的 Message
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 消息已编辑 }
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: content 为空；消息已撤回不可编辑；消息发送超过 48 小时不可编辑
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非消息发送者（You can only edit your own messages）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 消息不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/recall:
    post:
      tags: [消息]
      summary: 撤回消息（置 is_recalled=true）
      description: |-
        【用途】撤回自己已发送的消息。

        【调用时机】用户在聊天页对自己发出的消息选择「撤回」时。

        【业务规则与注意事项】
        - 仅消息发送者可撤回，非发送者返回 403（You can only recall your own messages）。
        - 时间窗：仅发送后 48 小时内可撤回，超过返回 400（Cannot recall messages older than 48 hours）。
        - 撤回为软删除：仅置 is_recalled=true，消息记录与内容仍保留在库中，前端应展示「已撤回」占位。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      responses:
        '200':
          description: 撤回成功（message 为「消息已撤回」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 消息已撤回 }
                  data: { type: object, nullable: true, example: null }
        '400':
          description: 消息发送超过 48 小时不可撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非消息发送者（You can only recall your own messages）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 消息不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/read:
    post:
      tags: [消息]
      summary: 将会话标记为已读（单条 UPDATE，同步本人全部回执）
      description: |-
        【用途】把指定会话标记为已读。

        【调用时机】用户打开某个聊天会话、浏览到最新消息时。

        【业务规则与注意事项】
        - 注意：路径参数 id 为「会话 ID」（与旧版 API 保持一致），不是消息 ID。
        - 仅会话成员可操作，非成员返回 403。
        - 服务端用一条 UPDATE（含子查询）把本人在该会话下全部未读回执置为 is_read=true、read_at=当前时间；并把本人成员记录的 last_read_message_id 更新为该会话最新一条消息。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID（UUID；注意此处不是消息 ID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      responses:
        '200':
          description: 标记成功（message 为「已读标记成功」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 已读标记成功 }
                  data: { type: object, nullable: true, example: null }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/original-file:
    patch:
      tags: [消息]
      summary: 补传原图地址（v5.8.7 双上传策略：压缩版先发、原图后补）
      description: |-
        【用途】图片消息发送者补传原图地址：前端先发压缩版消息（file_url=压缩版、聊天流秒开），原图上传完成后回填 file_original_url 供「下载原图」使用。

        【调用时机】发图片消息后，原图（大文件）后台上传完成时。

        【业务规则与注意事项】
        - 仅发送者本人可补传，非发送者返回 403（仅发送者本人可补传原图）。
        - 仅允许从空补填一次：file_original_url 已存在返回 400（原图已存在，不能重复补传）。
        - 已撤回 / 已焚毁消息不允许补传，返回 400（消息已撤回或已焚毁，不能补传原图）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_original_url]
              properties:
                file_original_url:
                  type: string
                  maxLength: 500
                  description: 原图文件 URL（由 POST /upload 上传原图后获得），最长 500 字符
                  example: /uploads/4f8a2b1c-9d4e-4c5b-a6f7-1e2d3c4b5a70.jpg
      responses:
        '200':
          description: 补传成功（message 为「原图已更新」），data 为更新后的 Message
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 原图已更新 }
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: 消息已撤回或已焚毁，不能补传原图；原图已存在，不能重复补传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 仅发送者本人可补传原图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 消息不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/reveal:
    post:
      tags: [消息]
      summary: 点开查看焚毁消息：下发完整内容并开始该用户的焚毁倒计时
      description: |-
        【用途】点开才焚（阅后即焚 v2）：焚毁消息（burn_ttl_seconds 非空）对所有人（含发送方）都是马赛克占位，调本接口才下发完整内容，并从点开时刻起开始该用户自己的焚毁倒计时。

        【调用时机】用户在聊天流点开一条焚毁消息时。

        【业务规则与注意事项】
        - 仅焚毁消息可点开：非焚毁消息返回 400（该消息不是焚毁消息，无需点开）；已撤回返回 400（消息已撤回）。
        - 重复点开不重置计时；自己那份倒计时已到期 / 兜底到期后一律按已焚毁 404 处理（消息已焚毁）。
        - v5.8.9 播完才焚（仅音视频焚毁消息，含 type=file 的视频扩展名）：倒计时为「消费窗口」= max(burn_ttl_seconds, 媒体时长 + 缓冲 30s)，窗口内可反复播放；body 可带 media_duration_seconds（前端播放器 metadata 时长，仅存库值缺失时兜底）；返回 media_burn_pending=true 提示前端播放完成/放弃时调 POST /messages/{id}/consume 提前焚毁，consume_deadline 为窗口截止时刻。文本/图片焚毁消息两字段为 false / 不返回。
        - 首次点开即标记已读并广播已读回执（发送方实时看到「对方已点开」）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                media_duration_seconds:
                  type: integer
                  minimum: 1
                  maximum: 7200
                  description: 音视频时长（秒，1~7200）。仅音视频焚毁消息生效：消费窗口 = max(burn_ttl_seconds, 时长+缓冲30s)；时长优先用发送时存库的 media_duration，本参数仅在存库值缺失时兜底（老消息）；文本/图片焚毁消息忽略此参数
                  example: 30
      responses:
        '200':
          description: 点开成功（message 为「已点开」），data 为完整 Message + 焚毁视图字段（is_blurred=false、burn_at、remain_seconds；音视频消息另有 media_burn_pending、consume_deadline）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 已点开 }
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: 该消息不是焚毁消息，无需点开；消息已撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 消息不存在；消息已焚毁（自己这份倒计时已到期或兜底到期）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/consume:
    post:
      tags: [消息]
      summary: 消费音视频焚毁消息（v5.8.9 播完才焚）：播放完成/放弃时提前焚毁
      description: |-
        【用途】音视频焚毁消息「播完才焚」的收尾动作：前端播放完成或中途放弃时调用，后端把该用户的焚毁截止时间（burn_at）提前置为当下——此后他再 reveal 即「已焚毁」。

        【调用时机】焚毁的语音/视频消息播放完成或用户中途放弃观看时。

        【业务规则与注意事项】
        - 仅音视频焚毁消息支持（voice/video 或 file+视频扩展名）：非焚毁消息返回 400（该消息不是焚毁消息，无需消费）；非音视频焚毁消息返回 400（仅音视频焚毁消息支持播完才焚）。
        - 必须先 reveal（拿到过内容才谈得上消费），否则 400（请先点开查看后再消费）。
        - 幂等：重复调用 / 自己窗口已到期 / 消息已被调度器物理删除，均返回 already=true 成功。
        - 物理删除仍由调度器统一执行（所有接收方都到期才删行删文件，群聊「各看各的」语义不变，未看成员不受影响）。
        - 广播 message:consumed 事件：对端与本人其他在线设备实时切「已焚毁」态。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      responses:
        '200':
          description: 消费成功（message 为「已消费，进入焚毁」），data 为焚毁视图（is_blurred=true、内容字段置 null、不吐密文）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 已消费，进入焚毁 }
                  data:
                    type: object
                    description: 焚毁视图（对齐前端契约：内容字段置 null，不吐密文）
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: 消息 ID
                        example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
                      conversation_id:
                        type: string
                        format: uuid
                        description: 所属会话 ID
                        example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
                      type:
                        type: string
                        enum: [text, image, voice, video, file]
                        description: 消息类型
                        example: video
                      is_blurred:
                        type: boolean
                        description: 焚毁视图标记，恒为 true
                        example: true
                      content:
                        type: string
                        nullable: true
                        description: 恒为 null（已焚毁不下发内容）
                        example: null
                      file_url:
                        type: string
                        nullable: true
                        description: 恒为 null（已焚毁不下发附件）
                        example: null
                      file_original_url:
                        type: string
                        nullable: true
                        description: 恒为 null（已焚毁不下发原图）
                        example: null
                      burn_at:
                        type: string
                        format: date-time
                        description: 该用户焚毁截止时间（消费成功时已置为当下）
                        example: '2026-09-04T09:00:05.000Z'
                      burned:
                        type: boolean
                        description: 是否已焚毁，恒为 true
                        example: true
                      already:
                        type: boolean
                        description: 是否此前已焚毁（幂等标记）：true=重复调用/已到期/消息已物理删除；false=本次首次消费
                        example: false
        '400':
          description: 该消息不是焚毁消息，无需消费；仅音视频焚毁消息支持播完才焚；请先点开查看后再消费；消息已撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{id}/receipt:
    get:
      tags: [消息]
      summary: 消息回执列表（送达/已读明细，含用户姓名）
      description: |-
        【用途】查看一条消息的逐人回执明细（是否送达、是否已读、已读时间）。

        【调用时机】群聊中点击自己消息的「已读/未读」详情时。

        【业务规则与注意事项】
        - 仅该消息所在会话的成员可查看，非成员返回 403（修复了旧版任意用户可查漏洞）。
        - 消息不存在返回 404。
        - 回执在消息发送时为除发送者外的每位成员各创建一条；每条附 user_display_name 便于直接展示。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID（UUID）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      responses:
        '200':
          description: 成功，data 为回执数组（含用户姓名）
