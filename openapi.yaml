        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非会话成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 消息不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/admin/all:
    get:
      tags: [群组]
      summary: 管理员：全量群组列表（含群主信息、成员数、解散状态）
      description: |-
        【用途】管理后台群组管理页：查询全部群组（type=group），附群主姓名/手机号与解散状态。

        【调用时机】管理后台「群组管理」列表页加载、搜索与翻页时。

        【业务规则与注意事项】
        - 仅 admin 可调用，普通用户返回 403。
        - keyword 按群名称模糊搜索；include_dissolved=true 时包含已解散群（默认仅未解散）。
        - 按创建时间倒序分页。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 页码，从 1 开始
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
          description: 每页条数，默认 20
          example: 20
        - name: keyword
          in: query
          schema: { type: string }
          description: 按群名称模糊搜索
          example: 产品
        - name: include_dissolved
          in: query
          schema: { type: string, enum: ['true', 'false'] }
          description: 是否包含已解散群：'true' 包含；默认不包含
          example: 'false'
      responses:
        '200':
          description: '成功，data 为 { data: 群组数组（附群主信息与解散状态）, total: 总数 }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Conversation'
                            - type: object
                              properties:
                                owner_display_name:
                                  type: string
                                  nullable: true
                                  description: 群主显示名（无群主时为 null）
                                  example: 张三
                                owner_phone:
                                  type: string
                                  nullable: true
                                  description: 群主手机号（无群主时为 null）
                                  example: '13800138000'
                                is_dissolved:
                                  type: boolean
                                  description: 是否已解散（dissolved_at 非空即 true）
                                  example: false
                      total:
                        type: integer
                        description: 群组总数（按筛选条件）
                        example: 18
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/admin/{id}:
    delete:
      tags: [群组]
      summary: 管理员：强制解散群（软解散，消息记录保留供审计）
      description: |-
        【用途】管理员强制解散一个群组。

        【调用时机】管理后台「群组管理」列表页对违规群执行解散时。

        【业务规则与注意事项】
        - 仅 admin 可调用；群组不存在返回 404。
        - 软解散：标记 dissolved_at（与 dissolved_by），成员不可再发消息、会话从成员列表消失；消息与成员记录保留供审计。
        - 解散操作实时推送给全体成员（WS），并写入审计日志。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群组（会话）ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      responses:
        '200':
          description: 解散成功（message 为「群组已解散」），data 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 群组已解散 }
                  data: { nullable: true, example: null }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 群组不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups:
    post:
      tags: [群组]
      summary: 创建群组或频道，创建者为 owner
      description: |-
        【用途】创建群组（或频道）会话。

        【调用时机】用户在 App 选择「发起群聊/创建频道」并选定初始成员后提交时。

        【业务规则与注意事项】
        - 创建者自动成为群主（role=owner），同时计入成员；member_ids 中即使包含创建者也会被自动去重。
        - member_ids 最多 500 个，每个必须是合法 UUID v4；新加成员角色均为 member。
        - is_channel=true 时创建频道：会话 is_channel 标记为 true（源码中会话 type 恒为 group，频道通过 is_channel 字段区分）。
        - 创建成功后 member_count = 1（创建者）+ 实际初始成员数。
        - 源码未校验 member_ids 对应的用户是否存在/启用，调用方应传入从通讯录获取的有效用户 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: 群名称，最长 200 字符
                  example: 产品评审群
                description:
                  type: string
                  description: 群简介（可选）
                  example: 每周三产品评审同步
                avatar_url:
                  type: string
                  maxLength: 500
                  description: 群头像 URL（可选，可先通过 POST /upload 上传获得），最长 500 字符
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
                member_ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: 初始成员用户 ID 数组（可选，最多 500 个；创建者无需包含在内，重复 ID 自动去重）
                  example: ['7c9e6679-7425-40de-944b-e07fc1f90ae7']
                is_channel:
                  type: boolean
                  description: 是否创建为频道（默认 false 为普通群组）
                  example: false
      responses:
        '200':
          description: 创建成功（message 为「群组创建成功」），data 为会话 Conversation（type=group）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 群组创建成功 }
                  data:
                    $ref: '#/components/schemas/Conversation'
        '400':
          description: 参数校验失败（name 缺失或超长、member_ids 超 500 个或含非法 UUID 等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/{id}:
    put:
      tags: [群组]
      summary: 更新群资料（均为可选字段）
      description: |-
        【用途】更新群名称、简介、头像，三个字段均为可选，仅提交的字段会被更新。

        【调用时机】群主/管理员在群设置页修改资料保存时。

        【业务规则与注意事项】
        - 仅群主（owner）或群管理员（admin）可调用，普通成员返回 403（Only group owner or admin can update group info）。
        - 响应为更新后的完整 Conversation。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: 群名称，最长 200 字符
                  example: 产品评审群（新版）
                description:
                  type: string
                  description: 群简介
                  example: 每周三 14:00 产品评审
                avatar_url:
                  type: string
                  maxLength: 500
                  description: 群头像 URL，最长 500 字符
                  example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
      responses:
        '200':
          description: 更新成功（message 为「群组信息更新成功」），data 为更新后的 Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 群组信息更新成功 }
                  data:
                    $ref: '#/components/schemas/Conversation'
        '400':
          description: 参数校验失败（如字段超长）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 权限不足，仅群主/群管理员可操作（Only group owner or admin can update group info）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [群组]
      summary: 群主：解散自己的群（解散即焚：全群消息到期由调度器物理清除）
      description: |-
        【用途】群主解散自己创建的群组。

        【调用时机】群主在群设置页选择「解散群聊」并确认时。

        【业务规则与注意事项】
        - 仅群主可解散，非群主返回 403（仅群主可解散群）；群已解散返回 400（该群组已被解散）。
        - 解散即焚：事务内标记 dissolved_at / dissolved_by，并把该群未销毁消息的 destroy_at 全部置为解散时刻——消息立即对成员不可见，等待焚毁调度器物理清除（与管理员软解散保留消息记录不同）。
        - 解散操作实时推送给全体成员（WS，reason=dissolved），会话列表立即移除该群；群记录保留。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群组（会话）ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      responses:
        '200':
          description: 解散成功（message 为「群组已解散」），data 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 群组已解散 }
                  data: { nullable: true, example: null }
        '400':
          description: 该群组已被解散
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非群主（仅群主可解散群）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 群组不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/{id}/members:
    get:
      tags: [群组]
      summary: 群成员列表（含成员用户信息）
      description: |-
        【用途】获取群成员列表，每条成员记录附带该成员的姓名与头像。

        【调用时机】打开群聊的成员列表/群设置页时。

        【业务规则与注意事项】
        - 仅本群成员可查看，非成员返回 403（修复了旧版任意用户可查漏洞）。
        - 结果按成员角色 role 字段升序排列；每条在 ConversationMember 基础上附带 user_display_name、user_avatar_url 便于直接展示。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      responses:
        '200':
          description: 成功，data 为群成员数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupMember'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非群成员（Access denied to this conversation）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [群组]
      summary: 批量添加群成员
      description: |-
        【用途】向群内批量添加成员。

        【调用时机】群主/管理员在群设置页「添加成员」选人后提交时。

        【业务规则与注意事项】
        - 仅群主（owner）或群管理员（admin）可调用，普通成员返回 403（Only group owner or admin can add members）。
        - member_ids 必填，最多 500 个，每个必须是合法 UUID v4；新成员角色均为 member。
        - 已在群内的用户 ID 自动跳过（幂等），全部已存在时不做任何变更；添加成功后同步更新会话 member_count。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_ids]
              properties:
                member_ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: 待添加的用户 ID 数组（最多 500 个）
                  example: ['7c9e6679-7425-40de-944b-e07fc1f90ae7']
      responses:
        '200':
          description: 添加成功（message 为「成员添加成功」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 成员添加成功 }
                  data: { type: object, nullable: true, example: null }
        '400':
          description: member_ids 缺失、超 500 个或含非法 UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 权限不足，仅群主/群管理员可操作（Only group owner or admin can add members）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/{id}/members/{userId}:
    delete:
      tags: [群组]
      summary: 移除群成员
      description: |-
        【用途】把指定用户移出群聊。

        【调用时机】群主/管理员在成员列表中执行「移出群聊」时。

        【业务规则与注意事项】
        - 仅群主（owner）或群管理员（admin）可调用（Only group owner or admin can remove members）；源码未对「本人退群」做单独豁免，普通成员调用同样返回 403。
        - 群主不可被移除，尝试移除群主返回 403（Cannot remove the group owner）。
        - 移除成功后同步更新会话 member_count。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群会话 ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 被移除用户 ID（UUID）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '200':
          description: 移除成功（message 为「成员已移除」，data 为 null）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 成员已移除 }
                  data: { type: object, nullable: true, example: null }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 权限不足，仅群主/群管理员可操作；或尝试移除群主（Cannot remove the group owner）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /groups/{id}/transfer:
    post:
      tags: [群组]
      summary: 群主转让：把 owner 身份转给群内另一个成员
      description: |-
        【用途】群主把群主身份转让给群内另一成员，自己降为普通成员（不退群）。

        【调用时机】群主在群设置页选择「转让群主」并确认时。

        【业务规则与注意事项】
        - 仅群主可操作，非群主返回 403（仅群主可转让群主）；不能转让给自己（400）。
        - 目标用户必须是当前群内成员，否则 400（目标用户不是本群成员）；群已解散返回 400（该群组已被解散）。
        - 事务执行：会话 owner_id 改为新群主（乐观锁防并发转让，冲突返回 409 群主已被他人变更，请刷新后重试），老群主角色降为 member。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 群组（会话）ID（UUID）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_owner_id]
              properties:
                new_owner_id:
                  type: string
                  format: uuid
                  description: 新群主用户 ID（UUIDv4），必须是当前群内成员
                  example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
      responses:
        '200':
          description: 转让成功（message 为「群主已转让」），data 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 群主已转让 }
                  data: { nullable: true, example: null }
        '400':
          description: new_owner_id 非法；转让给自己；目标用户不是本群成员；群已解散
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非群主（仅群主可转让群主）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 群组不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 并发转让冲突（群主已被他人变更，请刷新后重试）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /keys:
    post:
      tags: [加密密钥]
      summary: 上传/更新自己的 X25519 identity 公钥（1 用户 1 公钥，幂等）
      description: |-
        【用途】上传或轮换当前用户的 E2E 端到端加密身份公钥（X25519）。

        【调用时机】客户端首次生成密钥对时上传；换设备/重装后密钥对重建时轮换。

        【业务规则与注意事项】
        - upsert 语义：已存在则覆盖公钥并更新 updated_at；相同公钥幂等不写（updated=false）。
        - 服务端只存公钥（零接触明文私钥）；私钥仅存客户端 IndexedDB / Keychain。
        - 公钥轮换时向所有共同会话用户广播 WS 事件 key:changed（TOFU：客户端收到后重新比对公钥，不一致则告警「对方安全密钥已变更」）。
        - 限流：每用户每分钟 5 次（429），防脚本暴力覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_pubkey]
              properties:
                identity_pubkey:
                  type: string
                  minLength: 43
                  maxLength: 44
                  description: X25519 identity 公钥，base64 编码（32 字节 → 43-44 字符，标准/URL-safe base64 均可）
                  example: MCowBQYDK2VuAyEAj1Zs8a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4=
      responses:
        '200':
          description: 上传成功（message 为「公钥已上传」），data 为 { updated }
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 公钥已上传 }
                  data:
                    type: object
                    properties:
                      updated:
                        type: boolean
                        description: 是否发生写入：true=新建或轮换；false=相同公钥幂等不写
                        example: true
        '400':
          description: 公钥格式错误（需 32 字节 X25519 公钥的 base64 编码）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 触发限流（每用户每分钟最多 5 次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /keys/query:
    post:
      tags: [加密密钥]
      summary: 批量查询公钥（TOFU 前端比对用），单次上限 500 个
      description: |-
        【用途】App 启动 / 进群时一次拉一组联系人的公钥 + 更新时间，与本地钉住的公钥缓存比对（TOFU）。

        【调用时机】App 启动加载通讯录/进入群聊时批量比对公钥，省去逐个 GET /keys/{userId}。

        【业务规则与注意事项】
        - 权限同单个查询：只返回「自己 + 与自己至少一个共同会话的成员」；未上传公钥 / 无共同会话的用户不出现在结果里（前端自行 diff 出缺的）。
        - 结果自动去重且自己置前（自己永远可查，用于比对「我存储的 vs 服务端存的」）。
        - 限流：每分钟 30 次（429）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: 要查询的用户 ID 列表（最多 500 个；无共同会话的用户会被服务端过滤掉）
                  example: ['3f9a2b8e-1111-4222-8333-444455556666']
      responses:
        '200':
          description: 批量查询成功（message 为「公钥批量查询成功」），data 为公钥信息数组（仅含自己 + 共同会话成员）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: 公钥批量查询成功 }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserKeyInfo'
        '400':
          description: user_ids 为空 / 超 500 个 / 含非法 UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 触发限流（每分钟最多 30 次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /keys/{userId}:
    get:
      tags: [加密密钥]
      summary: 查询对方 X25519 公钥（须为共同会话成员；不返回任何 PII）
      description: |-
        【用途】E2E 加密发送前获取接收方的 identity 公钥（ECDH 计算 session key 用）。

        【调用时机】给对方发送端到端加密消息前；收到 key:changed 事件后重新比对。

        【业务规则与注意事项】
        - 权限：查自己直接放行（比对「我存储的 vs 服务端存的」）；查他人必须是至少一个共同会话的成员，否则 403（对方不在你的会话中，无权获取公钥）——防止任意用户拿公钥做关联分析。
        - 对方尚未上传公钥返回 404（你尚未上传公钥，请先生成并上传）。
        - 纯 E2E 元数据通道：不返回 phone / display_name 等任何 PII。
        - 限流：每分钟 60 次（429）。
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目标用户 ID（UUID；传自己的 ID 可查自己）
          example: 3f9a2b8e-1111-4222-8333-444455556666
      responses:
        '200':
          description: 成功，data 为对方公钥信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    $ref: '#/components/schemas/UserKeyInfo'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 对方不在你的会话中，无权获取公钥
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 你尚未上传公钥（目标用户未上传公钥时）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 触发限流（每分钟最多 60 次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /stats/overview:
    get:
      tags: [统计概览]
      summary: Dashboard 首页概览（仅管理员）：账号/活跃/消息量/存储占用
      description: |-
        【用途】管理后台 Dashboard 首页运营指标总览。

        【调用时机】管理员进入 Dashboard 首页时。

        【业务规则与注意事项】
        - 仅 admin 可调用，普通用户返回 403。
        - total_users 统计未删除账号；today_active_users = 今日登录过的设备所属用户 ∪ 今日发过消息的用户（去重）；today_messages / total_messages 仅按 messages 表现存行统计（已物理清除的焚毁消息不计入）。
        - total_conversations 不含已解散会话；total_groups 不含已解散群。
        - storage：上传目录磁盘占用（递归求和）+ 当前库数据占用（information_schema 的 data_length + index_length）。
      responses:
        '200':
          description: 成功，data 为概览指标对象
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      total_users:
                        type: integer
                        description: 未删除账号总数
                        example: 156
                      disabled_users:
                        type: integer
                        description: 已停用账号数
                        example: 3
                      deleted_users:
                        type: integer
                        description: 已删除账号数
                        example: 1
                      today_active_users:
                        type: integer
                        description: 今日活跃用户数（今日登录设备所属用户 ∪ 今日发言用户，去重）
                        example: 89
                      today_messages:
                        type: integer
                        description: 今日消息量（按 messages 表现存行统计）
                        example: 1204
                      total_messages:
                        type: integer
                        description: 消息总量（现存行）
                        example: 87654
                      total_conversations:
                        type: integer
                        description: 会话总数（不含已解散）
                        example: 312
                      total_groups:
                        type: integer
                        description: 群组总数（type=group 且未解散）
                        example: 45
                      online_devices:
                        type: integer
                        description: 当前在线设备数
                        example: 67
                      storage:
                        type: object
                        description: 存储占用
                        properties:
                          upload_bytes:
                            type: integer
                            description: 上传目录磁盘占用（字节）
                            example: 5368709120
                          upload_files:
                            type: integer
                            description: 上传目录文件数
                            example: 2345
                          db_bytes:
                            type: integer
                            description: 数据库数据占用（data_length + index_length，字节）
                            example: 1073741824
                          total_bytes:
                            type: integer
                            description: 合计占用（字节）
                            example: 6442450944
                      generated_at:
                        type: string
                        format: date-time
                        description: 指标生成时间（ISO8601）
                        example: '2026-09-04T09:00:00.000Z'
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 非管理员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /upload:
    post:
      tags: [文件上传]
      summary: 上传消息附件（图片/语音/视频/文档），最大 50MB，本地存储或 OSS 外置（v5.9.0）
      description: |-
        【用途】上传消息附件（图片/语音/视频/文档等），获得可访问的 URL 与缩略图 URL。

        【调用时机】发送附件类消息前：先调本接口上传文件，再把返回的 url 作为 file_url 调 POST /messages 发消息。

        【业务规则与注意事项】
        - multipart/form-data 上传，文件字段名 file，单文件最大 50MB（超出返回 413）；同一 IP 每分钟最多 30 个文件（429）。
        - v5.9.0 OSS 外置存储：启用时原图 + 缩略图经内网上传 OSS（成功后删除本地副本，返回外网签名 URL）；OSS 未启用或任一步上传失败自动回退本地 UPLOAD_DIR，经 /uploads/<filename> 静态访问（与旧版行为一致，可用性优先）。
        - 图片自动生成 480 宽 webp 缩略图（质量 75），返回 thumb_url（gif 跳过、生成失败或非图片时为 null，前端回退用原图）。
        - 落盘文件名为 <UUID><原扩展名>；返回的 file_name 为原始文件名（服务端已修正中文文件名的 latin1→utf8 编码问题）。
        - Word/Excel 文档由前端端内解析预览。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 待上传的文件（最大 50MB）
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: 静态访问路径（/uploads/<filename>），发消息时填入 file_url
                        example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.pdf
                      file_name:
                        type: string
                        description: 原始文件名（UTF-8）
                        example: 会议纪要.pdf
                      file_size:
                        type: integer
                        description: 文件大小（字节）
                        example: 204800
                      thumb_url:
                        type: string
                        nullable: true
                        description: 图片缩略图 URL（480 宽 webp，存 /uploads/thumb/ 或 OSS）；gif/非图片/生成失败时为 null，前端回退用原图
                        example: /uploads/thumb/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e_thumb.webp
        '400':
          description: 未接收到文件（未选择文件或字段名不是 file）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: 文件超过 50MB 限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        JWT access token。登录（POST /auth/login）或刷新（POST /auth/refresh-token）后获得，放入请求头：
        Authorization: Bearer <access_token>
        默认有效期 7200 秒；每个受保护请求都会实时校验账号状态与设备存在性，账号停用或设备下线后 token 立即失效。
  schemas:
    Error:
      type: object
      description: 统一错误响应（code 为 HTTP 状态码；参数校验失败时 message 为多条错误以 '; ' 拼接）
      properties:
        code:
          type: integer
          description: HTTP 状态码（400/401/403/404/409/413/429/500）
          example: 400
        message:
          type: string
          description: 错误描述
          example: 手机号格式不正确
      required: [code, message]

    SafeUser:
      type: object
      description: 对外用户信息（字段白名单，任何接口不会返回 password_hash 等敏感字段）
      properties:
        id:
          type: string
          format: uuid
          description: 用户 ID（UUID v4）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        phone:
          type: string
          description: 手机号（即用户名），1 开头 11 位数字
          example: '13800138000'
        display_name:
          type: string
          description: 显示名/姓名
          example: 张三
        avatar_url:
          type: string
          nullable: true
          description: 头像 URL，未设置为 null
          example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
        signature:
          type: string
          nullable: true
          description: 个性签名，未设置为 null
          example: 保持热爱，奔赴山海
        department:
          type: string
          nullable: true
          description: 部门，未设置为 null
          example: 工程部
        role:
          type: string
          enum: [user, admin]
          description: 角色：user 普通用户 / admin 管理员（可调用账号管理接口）
          example: user
        status:
          type: string
          enum: [active, disabled]
          description: 账号状态：active 正常 / disabled 已停用（停用后 token 立即失效且无法登录）
          example: active
        force_change_pwd:
          type: boolean
          description: 是否需强制改密；true 时前端应强制跳转修改密码（新开通或被重置密码的账号为 true）
          example: false
        created_at:
          type: string
          format: date-time
          description: 创建时间（服务端 datetime）
          example: '2026-08-01T02:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间（服务端 datetime）
          example: '2026-08-20T09:30:00.000Z'

    Device:
      type: object
      description: 已登录设备记录（每次登录生成一条；删除记录即强制下线）
      properties:
        id:
          type: string
          format: uuid
          description: 设备记录主键（下线设备接口用此值）
          example: 3f8a2b1c-9d4e-4c5b-a6f7-1e2d3c4b5a69
        user_id:
          type: string
          format: uuid
          description: 所属用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        device_name:
          type: string
          description: 设备名称（登录时传入，如 iPhone 15）
          example: iPhone 15
        device_type:
          type: string
          enum: [mobile, desktop, tablet, web]
          description: 设备类型：mobile 手机 / desktop 桌面端 / tablet 平板 / web 网页端
          example: mobile
        device_id:
          type: string
          format: uuid
          description: 设备指纹（服务端生成的 UUID，与记录主键 id 不同）
          example: a1b2c3d4-e5f6-4789-8a0b-c1d2e3f4a5b6
        is_online:
          type: boolean
          description: 是否在线
          example: true
        last_active_at:
          type: string
          format: date-time
          nullable: true
          description: 最近活跃时间
          example: '2026-08-26T03:00:00.000Z'
        created_at:
          type: string
          format: date-time
          description: 登录（记录创建）时间
          example: '2026-08-26T03:00:00.000Z'

    Message:
      type: object
      description: |-
        消息对象。销毁语义（v5.9.3 两套并存）：
        - 定时销毁（destroy_at）：到期由服务端定时任务销毁——清空 content/file_url 并置 is_destroyed=true；
        - 点开才焚（burn_ttl_seconds 非空）：焚毁消息对所有人（含发送方）先返回马赛克占位（is_blurred=true，内容字段全部置 null），
          调 POST /messages/{id}/reveal 后才下发完整内容并开始该用户各自倒计时；到期后该条消息对该用户不再返回。
        消息列表/搜索接口中的焚毁消息附带视图字段 is_blurred / burn_at / remain_seconds（已点开未到期时）。
      properties:
        id:
          type: string
          format: uuid
          description: 消息 ID（UUID v4）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
        conversation_id:
          type: string
          format: uuid
          description: 所属会话 ID
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        sender_id:
          type: string
          format: uuid
          description: 发送者用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type:
          type: string
          enum: [text, image, voice, video, file]
          description: 消息类型：text 文本 / image 图片 / voice 语音 / video 视频 / file 文件
          example: text
        content:
          type: string
          nullable: true
          description: 文本内容；附件类消息或被销毁后为 null
          example: 会议纪要已发，请查收
        file_url:
          type: string
          nullable: true
          description: 附件 URL（POST /upload 返回）；文本消息或被销毁后为 null
          example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.pdf
        file_name:
          type: string
          nullable: true
          description: 附件原始文件名
          example: 会议纪要.pdf
        file_size:
          type: integer
          nullable: true
          description: 附件大小（字节）
          example: 204800
        reply_to_id:
          type: string
          format: uuid
          nullable: true
          description: 被回复消息的 ID（引用回复），无则 null
          example: null
        is_edited:
          type: boolean
          description: 是否被编辑过（编辑成功后为 true，前端展示「已编辑」）
          example: false
        is_recalled:
          type: boolean
          description: 是否已撤回（撤回为软删除，前端展示「已撤回」占位）
          example: false
        is_destroyed:
          type: boolean
          description: 阅后即焚是否已销毁（销毁后 content/file_url 已清空）
          example: false
        destroy_at:
          type: string
          format: date-time
          nullable: true
          description: 销毁时间。普通阅后即焚消息：到期由定时任务自动销毁；点开才焚消息（burn_ttl_seconds 非空）：本字段为兜底强制焚毁时间（发送时 = created_at + 兜底小时数，防止一直不点开导致消息永久留存）；非焚毁消息为 null
          example: null
        burn_ttl_seconds:
          type: integer
          nullable: true
          description: 点开才焚 TTL（秒）：点开查看后多少秒焚毁（如 5）；null = 非焚毁消息。焚毁消息对全员（含发送方）先显示马赛克占位，调 POST /messages/{id}/reveal 才下发内容并开始各成员各自的倒计时（互不影响）；destroy_at 在此模式下仅作兜底强制焚毁时间
          example: null
        file_original_url:
          type: string
          nullable: true
          description: 原图地址（v5.8.7 图片链路优化）：file_url 存前端压缩版（聊天流秒开），本字段存发送端原图供「下载原图」使用；NULL = 无原图（老消息/纯文本/压缩失败直传原图），前端回退用 file_url 下载
          example: null
        media_duration:
          type: integer
          nullable: true
          description: 音视频时长（秒，v5.8.9 播完才焚）：发送端上报（语音=录音秒数、视频=播放器 metadata duration）。焚毁消息 reveal 时消费窗口 = max(burn_ttl_seconds, media_duration + 缓冲 30s)，保证「10s 焚毁 + 30s 视频」能播完再焚；NULL = 未上报，reveal 走默认窗口兜底
          example: null
        mentions:
          type: array
          items: { type: string, format: uuid }
          description: '@提及：本条消息实际@到的成员用户 ID 数组（前端据此精确判定「有人@我」，替代按昵称文本匹配）。仅保留会话成员（非成员过滤）；非加密范围，属成员关系元数据；null 归一化为空数组'
          example: []
        is_encrypted:
          type: boolean
          description: E2E 端到端加密标记：true 时 content 仅为占位提示（如「[加密消息]」），明文需客户端用 cipher_text + cipher_nonce + sender_ephemeral_pubkey 解密（AES-256-GCM + X25519 ECDH，详见 docs/E2E_ENCRYPTION.md）
          example: false
        cipher_nonce:
          type: string
          nullable: true
          description: AES-256-GCM nonce，base64 编码（12 字节 → 16 字符）；加密消息必填，明文消息为 null；焚毁消息未点开时不下发（置 null）
          example: null
        cipher_text:
          type: string
          nullable: true
          description: AES-256-GCM 密文 + auth tag，base64 编码；加密消息必填，明文消息为 null；焚毁消息未点开时不下发（置 null）
          example: null
        sender_ephemeral_pubkey:
          type: string
          nullable: true
          description: 发送方临时 X25519 公钥，base64 编码（32 字节 → 44 字符）；加密消息必填，明文消息为 null；焚毁消息未点开时不下发（置 null）
          example: null
        is_blurred:
          type: boolean
          description: 焚毁视图标记（运行时字段，仅焚毁消息出现）：true = 未点开的马赛克占位（内容字段已置 null）；false = 已点开，下发完整内容
          example: true
        burn_at:
          type: string
          format: date-time
          nullable: true
          description: 该用户这份内容的焚毁截止时间（运行时字段，已点开后返回）；到期后该条消息对该用户不再返回
          example: '2026-09-04T09:00:05.000Z'
        remain_seconds:
          type: integer
          nullable: true
          description: 该用户焚毁倒计时剩余秒数（运行时字段，已点开后返回，前端据此跑本地倒计时）
          example: 5
        media_burn_pending:
          type: boolean
          description: 播完才焚标记（v5.8.9，仅音视频焚毁消息 reveal 响应返回）：true 提示前端播放完成/放弃时调 POST /messages/{id}/consume 提前焚毁；文本/图片焚毁消息为 false/不返回
          example: false
        consume_deadline:
          type: string
          format: date-time
          nullable: true
          description: 消费窗口截止时间（ISO8601，仅音视频焚毁消息 reveal 响应返回）：= max(burn_ttl_seconds, media_duration + 缓冲30s) 的截止时刻；到点未调 consume 由调度器兜底焚毁
          example: '2026-09-04T09:00:35.000Z'
        created_at:
          type: string
          format: date-time
          description: 发送时间（历史消息分页 before 游标传此值）
          example: '2026-08-26T08:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: '2026-08-26T08:00:00.000Z'

    Conversation:
      type: object
      description: 会话对象（私聊/群/频道；私聊在会话列表中附带 other_user）
      properties:
        id:
          type: string
          format: uuid
          description: 会话 ID（UUID v4）
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        type:
          type: string
          enum: [private, group, channel]
          description: 会话类型：private 私聊 / group 群组 / channel 频道（群模块建频道时 type=group 且 is_channel=true；个人频道模块创建的频道 type=channel）
          example: group
        name:
          type: string
          nullable: true
          description: 会话名称（私聊为 null，前端用 other_user.display_name 展示）
          example: 产品评审群
        description:
          type: string
          nullable: true
          description: 群简介
          example: 每周三产品评审同步
        avatar_url:
          type: string
          nullable: true
          description: 会话头像 URL
          example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg
        owner_id:
          type: string
          format: uuid
          nullable: true
          description: 群主用户 ID（群会话），私聊为 null
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        is_channel:
          type: boolean
          description: 是否频道（群模块创建的频道：type=group 且 is_channel=true；channel 模块创建的个人频道：type=channel）
          example: false
        visibility:
          type: string
          enum: [public, private]
          description: 频道可见性（仅 type=channel 有意义）：public 进频道广场可自主订阅 / private 不进广场（P1 支持邀请链接订阅）
          example: public
        ai_enabled:
          type: boolean
          description: AI 成员开关（P2 预留）：开启后频道主可与 AI 对话，订阅者可围观
          example: false
        member_count:
          type: integer
          description: 成员数
          example: 12
        last_message_at:
          type: string
          format: date-time
          nullable: true
          description: 最后一条消息时间（会话列表按此倒序，无消息为 null 排最后）
          example: '2026-08-26T08:00:00.000Z'
        dissolved_at:
          type: string
          format: date-time
          nullable: true
          description: 软解散标记时间：非空表示群/频道已被解散，成员不可再发消息（消息记录保留供审计）；正常会话为 null
          example: null
        dissolved_by:
          type: string
          format: uuid
          nullable: true
          description: 执行解散操作的用户 ID（群主/频道主解散或管理员强制解散）；正常会话为 null
          example: null
        created_at:
          type: string
          format: date-time
          description: 创建时间
          example: '2026-08-01T02:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: '2026-08-26T08:00:00.000Z'
        other_user:
          allOf:
            - $ref: '#/components/schemas/SafeUser'
          nullable: true
          description: 私聊对方用户信息（仅 GET /conversations 会话列表中 type=private 时附带）

    ConversationMember:
      type: object
      description: 会话成员对象
      properties:
        id:
          type: string
          format: uuid
          description: 成员记录主键
          example: 2a3b4c5d-6e7f-48a9-b0c1-d2e3f4a5b6c7
        conversation_id:
          type: string
          format: uuid
          description: 所属会话 ID
          example: 1b2c3d4e-5f6a-47b8-89c0-d1e2f3a4b5c6
        user_id:
          type: string
          format: uuid
          description: 成员用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        role:
          type: string
          enum: [owner, admin, member]
          description: 群内角色：owner 群主（创建者，可设置管理员）/ admin 群管理员（可改群资料、增删成员）/ member 普通成员
          example: member
        muted:
          type: boolean
          description: 是否免打扰
          example: false
        last_read_message_id:
          type: string
          format: uuid
          nullable: true
          description: 最近已读到的消息 ID（标记已读时更新）
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
        joined_at:
          type: string
          format: date-time
          description: 加入时间
          example: '2026-08-01T02:00:00.000Z'

    GroupMember:
      type: object
      description: 群成员列表项（ConversationMember + 成员用户的姓名与头像）
      allOf:
        - $ref: '#/components/schemas/ConversationMember'
        - type: object
          properties:
            user_display_name:
              type: string
              description: 成员显示名（用户不存在时为 Unknown）
              example: 张三
            user_avatar_url:
              type: string
              nullable: true
              description: 成员头像 URL
              example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg

    MessageReceipt:
      type: object
      description: 消息回执（发送时为除发送者外的每位成员各创建一条）
      properties:
        id:
          type: string
          format: uuid
          description: 回执记录主键
          example: 8b9c0d1e-2f3a-44b5-96c7-d8e9f0a1b2c3
        message_id:
          type: string
          format: uuid
          description: 消息 ID
          example: 5e6f7a8b-9c0d-41e2-83f4-a5b6c7d8e9f0
        user_id:
          type: string
          format: uuid
          description: 接收者用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        is_delivered:
          type: boolean
          description: 是否已送达
          example: false
        is_read:
          type: boolean
          description: 是否已读
          example: true
        read_at:
          type: string
          format: date-time
          nullable: true
          description: 已读时间，未读为 null
          example: '2026-08-26T08:05:00.000Z'
        revealed_at:
          type: string
          format: date-time
          nullable: true
          description: 点开才焚：该用户点开查看消息内容的时间；NULL = 还没点开（列表只给马赛克占位）
          example: '2026-09-04T09:00:00.000Z'
        burn_at:
          type: string
          format: date-time
          nullable: true
          description: 点开才焚：该用户这份内容的焚毁截止时间（revealed_at + 消费窗口；音视频消息 = max(burn_ttl_seconds, media_duration + 缓冲30s)）；NULL = 未点开不计时
          example: '2026-09-04T09:00:35.000Z'
        created_at:
          type: string
          format: date-time
          description: 回执创建时间（即消息发送时间）
          example: '2026-08-26T08:00:00.000Z'
        user_display_name:
          type: string
          description: 接收者显示名（用户不存在时为 Unknown）
          example: 李四

    BatchResult:
      type: object
      description: 批量开通账号的逐条结果
      properties:
        phone:
          type: string
          description: 手机号
          example: '13900139002'
        display_name:
          type: string
          description: 姓名
          example: 李四
        password:
          type: string
          description: 初始密码（成功时为服务端生成的随机密码，仅此一次返回；失败时为空字符串）
          example: 'kX9#mQ2wE8rT'
        success:
          type: boolean
          description: 该条是否开通成功
          example: true
        error:
          type: string
          description: 失败原因（仅失败项存在，如「该手机号已开通账号」）
          example: 该手机号已开通账号

    Announcement:
      type: object
      description: 系统公告对象
      properties:
        id:
          type: string
          format: uuid
          description: 公告 ID（UUID v4）
          example: 6a1b2c3d-4e5f-4789-8a0b-c1d2e3f4a5b7
        title:
          type: string
          description: 公告标题，最长 200 字符
          example: 系统维护通知
        content:
          type: string
          description: 公告正文
          example: 本周六 22:00-24:00 服务器升级维护，期间消息可能延迟。
        priority:
          type: string
          enum: [normal, urgent]
          description: 优先级：normal 普通（仅进公告中心）/ urgent 紧急（额外走 WebSocket 实时弹窗推送到在线 App）
          example: normal
        target_type:
          type: string
          enum: [all, department]
          description: 目标范围：all 全员 / department 按部门定向
          example: all
        target_departments:
          type: string
          nullable: true
          description: target_type=department 时的部门名单。注意形态差异：创建接口（POST /announcements）返回原始 JSON 字符串（如 '["技术部","市场部"]'）；管理端列表（GET /announcements/manage）已解析为字符串数组返回
          example: '["技术部","市场部"]'
        created_by:
          type: string
          format: uuid
          description: 发布操作的管理员用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        created_at:
          type: string
          format: date-time
          description: 发布时间
          example: '2026-09-04T02:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: '2026-09-04T02:00:00.000Z'

    AppVersion:
      type: object
      description: App 版本发布记录（V5.8 App 自更新）。版本判定一律用整数 version_code，不要用 version_name 字符串比较（"5.10" < "5.9" 的字符串比较是错的）
      properties:
        id:
          type: string
          format: uuid
          description: 版本记录 ID（UUID v4）
          example: 7d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f5a
        platform:
          type: string
          enum: [android, ios]
          description: 平台：android / ios（iOS 上线前仅 android；同一 version_code 可在两平台各发一条）
          example: android
        version_code:
          type: integer
          description: Android versionCode / iOS build number：同 platform 内全局递增整数，客户端据此判断有无新版本
          example: 58
        version_name:
          type: string
          description: 展示用版本名（如 5.8），仅用于弹窗展示，不参与大小比较
          example: '5.8'
        apk_url:
          type: string
          description: APK 下载地址（相对路径 /uploads/app/xxx.apk，客户端自行拼 baseURL）
          example: /uploads/app/fenxin-android-v5.8-3f9a2b8e.apk
        file_size:
          type: integer
          description: APK 文件大小（字节），客户端用于展示与下载进度估算
          example: 31457280
        force:
          type: boolean
          description: 是否强制更新：true 时客户端弹窗不给「下次再说」
          example: false
        notes:
          type: string
          description: 更新说明（发版日志，弹窗内展示）
          example: '1. 修复焚毁倒计时偏移
2. 新增点开才焚'
        published:
          type: boolean
          description: 发布状态：false=已撤回（App 端 latest 接口不再返回该版本），文件保留
          example: true
        created_by:
          type: string
          format: uuid
          description: 发布操作的管理员用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        created_at:
          type: string
          format: date-time
          description: 发布时间
          example: '2026-09-04T02:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: '2026-09-04T02:00:00.000Z'

    AuditLog:
      type: object
      description: 审计日志记录（账号/群组/版本等敏感操作留痕）
      properties:
        id:
          type: string
          format: uuid
          description: 日志 ID（UUID v4）
          example: 0a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        user_id:
          type: string
          format: uuid
          nullable: true
          description: 操作人用户 ID（系统级操作可能为 null）
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        action:
          type: string
          description: 动作标识，如 login / create_account / reset_password / enable_account / disable_account / remove_device / change_password / batch_import_accounts / dissolve_group / publish_announcement / publish_app_version / reply_feedback
          example: reset_password
        target_type:
          type: string
          nullable: true
          description: 目标类型，如 user / device / group / announcement / app_version / feedback
          example: user
        target_id:
          type: string
          format: uuid
          nullable: true
          description: 目标对象 ID
          example: 3f9a2b8e-1111-4222-8333-444455556666
        detail:
          type: string
          nullable: true
          description: 操作详情（英文描述，keyword 模糊搜索命中此字段）
          example: 'Reset password for user 13800138000'
        ip_address:
          type: string
          nullable: true
          description: 操作来源 IP
          example: 192.168.1.100
        user_agent:
          type: string
          nullable: true
          description: 操作端 User-Agent
          example: Mozilla/5.0 (Linux; Android 14)
        created_at:
          type: string
          format: date-time
          description: 操作时间
          example: '2026-09-04T08:30:00.000Z'

    Feedback:
      type: object
      description: 意见反馈对象（管理员回复后 status=processed 并附回复内容）
      properties:
        id:
          type: string
          format: uuid
          description: 反馈 ID（UUID v4）
          example: 9f4a5b6c-7d8e-4f9a-0b1c-2d3e4f5a6b7c
        user_id:
          type: string
          format: uuid
          description: 提交人用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        content:
          type: string
          description: 意见内容
          example: 希望群聊支持按部门批量拉人，每次手动加人太麻烦了。
        contact:
          type: string
          nullable: true
          description: 用户自愿留下的联系方式（可选）
          example: '13800138000'
        status:
          type: string
          enum: [pending, processed]
          description: 处理状态：pending 待处理 / processed 已处理（管理员回复后置为 processed）
          example: pending
        admin_reply:
          type: string
          nullable: true
          description: 管理员回复内容，未回复为 null
          example: null
        replied_by:
          type: string
          format: uuid
          nullable: true
          description: 回复操作人（管理员）用户 ID，未回复为 null
          example: null
        replied_at:
          type: string
          format: date-time
          nullable: true
          description: 回复时间，未回复为 null
          example: null
        created_at:
          type: string
          format: date-time
          description: 提交时间
          example: '2026-09-04T08:30:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: '2026-09-04T08:30:00.000Z'

    ChannelOwner:
      type: object
      description: 频道主对外展示的公开信息（安全字段白名单，不带手机号等敏感信息）
      properties:
        id:
          type: string
          format: uuid
          description: 频道主用户 ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        display_name:
          type: string
          description: 频道主显示名
          example: 萝卜
        avatar_url:
          type: string
          nullable: true
          description: 频道主头像 URL，未设置为 null
          example: /uploads/9b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e.jpg

    UserKeyInfo:
      type: object
      description: 用户 X25519 身份公钥信息（E2E 纯元数据通道，不含任何 PII）
      properties:
        user_id:
          type: string
          format: uuid
          description: 公钥所属用户 ID
          example: 3f9a2b8e-1111-4222-8333-444455556666
        identity_pubkey:
          type: string
          description: X25519 identity 公钥，base64 编码（32 字节 → 44 字符）
          example: MCowBQYDK2VuAyEAj1Zs8a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4a4=
        created_at:
          type: string
          format: date-time
          description: 公钥首次上传时间
          example: '2026-08-01T02:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 公钥最近更新时间（轮换会刷新；TOFU 比对用）
          example: '2026-09-04T02:00:00.000Z'
