          example: 20
      responses:
        '200':
          description: '成功，data 为 { data: 公告列表项数组, total: 可见公告总数 }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: 公告 ID
                              example: 6a1b2c3d-4e5f-4789-8a0b-c1d2e3f4a5b7
                            title:
                              type: string
                              description: 公告标题
                              example: 系统维护通知
                            content:
                              type: string
                              description: 公告正文
                              example: 本周六 22:00-24:00 服务器升级维护，期间消息可能延迟。
                            priority:
                              type: string
                              enum: [normal, urgent]
                              description: 优先级：normal 普通 / urgent 紧急
                              example: normal
                            target_type:
                              type: string
                              enum: [all, department]
                              description: 目标范围：all 全员 / department 按部门定向
                              example: all
                            is_read:
                              type: boolean
                              description: 本人是否已读
                              example: false
                            created_at:
                              type: string
                              format: date-time
                              description: 发布时间
                              example: '2026-09-04T02:00:00.000Z'
                      total:
                        type: integer
                        description: 可见公告总数
                        example: 12
        '401':
          description: 未携带或无效/过期 token；账号已停用或设备已下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 账号不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /announcements/manage:
    get:
      tags: [系统公告]
      summary: 管理端：全部公告列表（含阅读人数），倒序分页
      description: |-
        【用途】管理后台查看全部公告（不区分目标范围），附带每条公告的阅读人数统计。

