          description: 页码，从 1 开始
          example: 1
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
          description: 每页条数，默认 20
          example: 20
      responses:
        '200':
          description: '成功，data 为 { data: AppVersion 数组, total: 总数 }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: ok }
                  data:
                    type: object
