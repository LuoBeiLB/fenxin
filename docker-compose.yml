name: burnmsg

services:
  mysql:
    image: mysql:8.0
    container_name: burnmsg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-burnmsg}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动跑 init SQL（仅当 /docker-entrypoint-initdb.d 为空目录时）
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - burnmsg-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burnmsg-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9091
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_DATABASE: ${DB_DATABASE:-burnmsg}
      DB_SYNC: ${DB_SYNC:-false}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 .env 中设置 JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-7200}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      DESTROY_RECEIPT_SECRET: ${DESTROY_RECEIPT_SECRET:?请在 .env 中设置 DESTROY_RECEIPT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:-13800000000}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${PORT:-9091}:9091"
    volumes:
      # 上传文件持久化（容器重启不丢）
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - burnmsg-net

volumes:
  mysql_data:
  app_uploads:

networks:
  burnmsg-net:
    driver: bridge
